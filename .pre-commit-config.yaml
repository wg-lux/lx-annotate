repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        name: ruff import sorting
        args:
          - --fix
          - --select
          - I
          - --config
          - "lint.isort.required-imports=['from __future__ import annotations']"
      - id: ruff-format
        args: ["lx_annotate", "tests"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: structure-manifests
        name: hierarchical context schema and drift
        entry: python scripts/lint_structure.py
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        pass_filenames: false
        always_run: true

      - id: pyright
        name: pyright type check
        entry: pyright lx_annotate
        language: system
        pass_filenames: false

      - id: openapi-generation
        name: OpenAPI generated artifacts are current
        entry: npm --prefix frontend run typegen
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest suite
        entry: pytest tests
        language: system
        pass_filenames: false

      - id: runtime-check-bundle-contract
        name: runtime check migration bundle contract
        entry: python scripts/evaluate_runtime_check_bundle.py
        language: system
        pass_filenames: false

      - id: frontend-vitest
        name: frontend vitest
        entry: npm --prefix frontend run test:unit -- --run
        language: system
        pass_filenames: false

      - id: api-contracts
        name: frontend/backend API contract test
        entry: pytest tests/contracts/test_frontend_backend_api_contract.py -q
        language: system
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend type-check
        entry: npm --prefix frontend run type-check:source
        language: system
        pass_filenames: false


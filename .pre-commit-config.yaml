repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.7
    hooks:
      - id: ruff
        args: ["--fix", "lx_annotate", "tests"]
        pass_filenames: false
      - id: ruff
        name: ruff import sorting
        args:
          - --fix
          - --select
          - I
          - --config
          - "lint.isort.required-imports=['from __future__ import annotations']"
      - id: ruff-format
        args: ["lx_annotate", "tests"]
        pass_filenames: false
  - repo: local
    hooks:
      - id: pyright
        name: pyright type check
        entry: devenv shell -- pyright lx_annotate
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest suite
        entry: devenv shell -- pytest tests
        language: system
        pass_filenames: false

      - id: runtime-checks
        name: runtime schema and environment check contracts
        entry: devenv shell -- pytest tests/system/test_environment_checks.py
        language: system
        pass_filenames: false

      - id: runtime-check-bundle-contract
        name: runtime check migration bundle contract
        entry: devenv shell -- python scripts/evaluate_runtime_check_bundle.py
        language: system
        pass_filenames: false

      - id: frontend-vitest
        name: frontend vitest
        entry: devenv shell -- npm --prefix frontend run test:unit -- --run
        language: system
        pass_filenames: false

      - id: api-contracts
        name: frontend/backend API contract test
        entry: devenv shell -- pytest tests/contracts/test_frontend_backend_api_contract.py -q
        language: system
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend type-check
        entry: devenv shell -- npm --prefix frontend run type-check
        language: system
        pass_filenames: false
  -   repo: https://github.com/PyCQA/flake8
      rev: 7.3.0
      hooks:
      -   id: flake8
  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: v2.3.0
      hooks:
      -   id: mypy
          additional_dependencies: [types-pyyaml]
          exclude: ^testing/resources/

[project]
name = "lx-annotate"
revision = "1.0"

[profiles.default]
# Host-owned runtime inputs only. Application-owned paths and defaults are
# derived by nix/runtime-environment.nix. Secret material is supplied through
# file handles and never stored inline in Secretspec.

# Runtime roots and secret handles
DATA_DIR = { description = "Canonical public runtime root", default = "data" }
STORAGE_DIR = { description = "Managed storage subtree", default = "data/storage" }
LX_ANNOTATE_ENCRYPTED_DATA_DIR = { description = "Protected runtime root for patient data and service-managed state", default = "" }
LX_ANNOTATE_MASTER_KEY_FILE = { description = "File containing the service KEK for envelope encryption", default = "" }
DJANGO_SECRET_KEY_FILE = { description = "File containing the Django secret key", default = "/tmp/django_secret.key" }
DJANGO_DB_PASSWORD_FILE = { description = "File containing the database password", default = "" }
DJANGO_KEYCLOAK_CLIENT_SECRET_FILE = { description = "File containing the Keycloak/OIDC client secret", default = "" }

# Outbound Hub sender identity and envelope contract. File handles are supplied
# by the host secret manager; no key or shared-secret material belongs inline.
ENDOREG_DEPLOYMENT_ROLE = { description = "Deployment role: standalone, site_node, or central_hub", default = "standalone" }
LX_ANNOTATE_HUB_EXPORT_REQUIRE_MTLS = { description = "Require an outbound mTLS client identity for Hub export", default = "true" }
LX_ANNOTATE_HUB_EXPORT_CLIENT_CERT_FILE = { description = "File containing the outbound Hub mTLS client certificate", default = "" }
LX_ANNOTATE_HUB_EXPORT_CLIENT_KEY_FILE = { description = "File containing the outbound Hub mTLS client private key", default = "" }
LX_ANNOTATE_HUB_EXPORT_CA_FILE = { description = "Trusted CA bundle for the outbound Hub HTTPS endpoint", default = "" }
LX_ANNOTATE_HUB_EXPORT_RECIPIENT_PUBLIC_KEY_FILE = { description = "File containing the Hub X25519 envelope recipient public key", default = "" }
LX_ANNOTATE_HUB_SOURCE_NODE_SECRET_FILE = { description = "File containing the source NetworkNode request-authentication secret", default = "" }
LX_ANNOTATE_HUB_EXPORT_ENVELOPE_STAGING_DIR = { description = "Protected staging directory for persisted encrypted Hub envelopes", default = "" }
LX_ANNOTATE_HUB_EXPORT_AUTO_QUEUE = { description = "Automatically queue eligible marked Hub exports", default = "false" }
LX_ANNOTATE_HUB_EXPORT_REQUEST_TIMEOUT_SECONDS = { description = "HTTP response timeout for long-running Hub registration and encrypted media apply", default = "21600" }
LX_ANNOTATE_HUB_EXPORT_STALE_AFTER_SECONDS = { description = "Age after which an active outbound Hub job is considered stale", default = "25200" }
LX_ANNOTATE_HUB_EXPORT_MAX_RETRIES = { description = "Maximum automatic retries for transient outbound Hub failures", default = "5" }
LX_ANNOTATE_HUB_EXPORT_LOCAL_CLEANUP_POLICY = { description = "Local cleanup policy after verified Hub apply", default = "retain_processed_media" }

# Inbound Hub receiver contract. The private-key setting contains one or more
# comma-separated file handles. The files themselves remain host-owned secrets.
ENDOREG_ENABLE_INCOMING_HUB_TRANSFERS = { description = "Enable encrypted Hub transfer intake on a central_hub deployment", default = "false" }
ENDOREG_HUB_TRANSFER_REQUIRE_SECURE_TRANSPORT = { description = "Reject inbound Hub transfer requests that are not HTTPS-equivalent", default = "true" }
ENDOREG_HUB_TRANSFER_REQUIRE_MTLS = { description = "Require proxy-attested mTLS for inbound Hub transfers", default = "true" }
ENDOREG_HUB_TRANSFER_MTLS_META_KEY = { description = "Django request META key carrying the proxy mTLS verification result", default = "HTTP_X_CLIENT_CERT_VERIFIED" }
ENDOREG_HUB_TRANSFER_MTLS_META_VALUE = { description = "Expected successful proxy mTLS verification value", default = "SUCCESS" }
ENDOREG_HUB_TRANSFER_MAX_UPLOAD_BYTES = { description = "Maximum accepted encrypted Hub envelope size in bytes", default = "53687091200" }
ENDOREG_HUB_TRANSFER_RECIPIENT_PRIVATE_KEY_FILES = { description = "Comma-separated absolute paths to current and retiring X25519 recipient private-key PEM files", default = "" }
ENDOREG_HUB_TRANSFER_REQUIRE_ROOT_OWNED_PRIVATE_KEYS = { description = "Require inbound Hub recipient private-key files to be owned by root", default = "true" }

# Host paths
ASSET_DIR = { description = "Path to the assets directory", default = "tests/assets" }
HOME_DIR = { description = "Service home directory", default = "." }
WORKING_DIR = { description = "Service working directory", default = "." }
DJANGO_STATIC_ROOT = { description = "Static deployment root", default = "staticfiles" }

# Database topology
DJANGO_DB_ENGINE = { description = "Database engine", default = "django.db.backends.postgresql" }
DEV_DB_ENGINE = { description = "Development database engine", default = "django.db.backends.postgresql" }
TEST_DB_ENGINE = { description = "Test database engine", default = "django.db.backends.postgresql" }
DJANGO_DB_NAME = { description = "Database name", default = "lxAnnotateLocal" }
DEV_DB_NAME = { description = "Development database name", default = "lxAnnotateLocal" }
TEST_DB_NAME = { description = "Test database name", default = "lxAnnotateTest" }
DJANGO_DB_USER = { description = "Database user", default = "lxAnnotateLocal" }
DJANGO_DB_HOST = { description = "Database host", default = "localhost" }
DJANGO_DB_PORT = { description = "Database port", default = "5432" }

# Public endpoint and Django policy
ALLOWED_HOSTS = { description = "Legacy allowed-host alias", default = "lx-annotate.local,localhost,127.0.0.1" }
DJANGO_ALLOWED_HOSTS = { description = "Allowed host addresses", default = "lx-annotate.local,localhost,127.0.0.1" }
DJANGO_CORS_ALLOWED_ORIGINS = { description = "CORS origins", default = "https://lx-annotate.local,http://127.0.0.1:3000" }
DJANGO_CSRF_TRUSTED_ORIGINS = { description = "CSRF trusted origins", default = "https://lx-annotate.local,http://127.0.0.1:3000" }
TIME_ZONE = { description = "Time zone", default = "Europe/Berlin" }
DJANGO_ENV = { description = "Django environment mode", default = "development" }
DJANGO_DEBUG = { description = "Debug mode", default = "False" }
DJANGO_SETTINGS_MODULE = { description = "Active settings module", default = "lx_annotate.settings.settings_prod" }
DJANGO_SETTINGS_MODULE_DEVELOPMENT = { description = "Development settings module", default = "lx_annotate.settings.settings_dev" }
DJANGO_SETTINGS_MODULE_PRODUCTION = { description = "Production settings module", default = "lx_annotate.settings.settings_prod" }
VITE_ENABLE_DEBUG = { description = "Frontend debug panels", default = "false" }
CENTER_NAME = { description = "Default center name", default = "Default Center" }
DJANGO_HOST = { description = "Django bind host", default = "localhost" }
DJANGO_PORT = { description = "Django bind port", default = "8000" }
EXEMPT_URLS = { description = "URLs exempt from Keycloak", default = "^/accounts/login/$" }
HTTP_PROTOCOL = { description = "Public HTTP protocol", default = "https" }
ENFORCE_AUTH = { description = "Enforce authentication", default = "True" }
OIDC_RP_CLIENT_ID = { description = "OIDC client ID", default = "endoregdb-api" }
LOGIN_URL = { description = "OIDC login URL", default = "/accounts/login/" }
BASE_URL = { description = "Public frontend URL", default = "https://lx-annotate.local" }
STATIC_URL = { description = "Static URL", default = "/static/" }
MEDIA_URL = { description = "Media URL", default = "/protected_media/" }
NGINX_PROTECTED_MEDIA_URL = { description = "Protected media URL for nginx handoff", default = "/protected_media/" }
SERVE_WITH_NGINX = { description = "Enable nginx protected-media offload", default = "True" }
PROTECTED_MEDIA_ROOT = { description = "Protected media root", default = "data/storage" }
LX_ANNOTATE_STREAMABLE_VIDEO_ROOT = { description = "Root for streamable video storage", default = "data/storage/streamable_videos" }
LX_ANNOTATE_STREAMABLE_VIDEO_RAW_ROOT = { description = "Root for raw streamable videos", default = "data/storage/streamable_videos/raw" }
LX_ANNOTATE_STREAMABLE_VIDEO_PROCESSED_ROOT = { description = "Root for processed streamable videos", default = "data/storage/streamable_videos/processed" }

# Runtime policy and intake paths
CELERY_VISIBILITY_TIMEOUT_SECONDS = { description = "Redis broker visibility timeout in seconds; must exceed every late-ack task and FFmpeg execution window", default = "90000" }
FFMPEG_TRANSCODE_TIMEOUT_SECONDS = { description = "Timeout in seconds for FFmpeg transcode operations", default = "3600" }
FFMPEG_EXECUTABLE = { description = "Explicit FFmpeg executable path", default = "" }
FFMPEG_BINARY = { description = "Legacy alias for explicit FFmpeg executable path", default = "" }
FFMPEG_PATH = { description = "Legacy FFmpeg executable or containing directory", default = "" }
FFMPEG_TRANSCODE_QUALITY_MODE = { description = "FFmpeg video transcoding quality", default = "balanced" }
DJANGO_FFMPEG_EXTRACT_FRAME_BATCHSIZE = { description = "FFmpeg frame extraction batch size", default = "500" }
VIDEO_DEFAULT_FPS = { description = "Default FPS for video processing", default = "50" }
VIDEO_ALLOW_FPS_FALLBACK = { description = "Allow FPS fallback", default = "True" }
LABEL_VIDEO_SEGMENT_MIN_DURATION_S_FOR_ANNOTATION = { description = "Minimum segment duration for annotation", default = "3" }
RUN_VIDEO_TESTS = { description = "Run video tests", default = "False" }
SKIP_EXPENSIVE_TESTS = { description = "Skip expensive tests", default = "True" }
TEST_RUN = { description = "Use reduced prediction test execution", default = "False" }
TEST_RUN_FRAME_NUMBER = { description = "Frames to process in test execution", default = "500" }
TEST_DISABLE_MIGRATIONS = { description = "Disable migrations during tests", default = "False" }
VIDEO_POST_VALIDATION_JOB_MAX_WORKERS = { description = "Maximum local post-validation worker threads", default = "2" }
VIDEO_POST_VALIDATION_JOB_MODE = { description = "Post-validation dispatch mode", default = "celery" }
LX_ANNOTATE_FRAME_DECODE_MAX_CONCURRENCY = { description = "Maximum concurrent on-demand frame decodes per application process", default = "2" }
LX_ANNOTATE_FRAME_DECODE_RETRY_AFTER_SECONDS = { description = "Retry-After delay returned when frame decode capacity is saturated", default = "1" }
ENDOREG_STORAGE_PROFILE = { description = "Video/report storage routing profile", default = "hybrid_default" }
RUST_BACKTRACE = { description = "Rust backtrace mode", default = "1" }
DRF_THROTTLE_ANON = { description = "Anonymous-user throttle", default = "100/day" }
DRF_THROTTLE_USER = { description = "Authenticated-user throttle", default = "1000/day" }
ENDOREG_REPORT_PDF_RENDERER_BIN = { description = "Path to the report PDF renderer", default = "" }
ENDOREG_DISABLE_RECONCILIATION = { description = "Disable startup reconciliation when set to 1", default = "0" }
LX_ANONYMIZER_PATH = { description = "Optional lx-anonymizer source override", default = "" }
OLLAMA_BIN = { description = "Optional explicit Ollama executable", default = "" }
LLM_ENABLED = { description = "Enable the configured report LLM provider", default = "true" }
LLM_PROVIDER = { description = "Report LLM provider: ollama or vllm (OpenAI-compatible)", default = "ollama" }
LLM_MODEL = { description = "Installed report LLM model; no automatic download or fallback", default = "lx-gemma4-e2b-json" }
LLM_BASE_URL = { description = "LLM server root URL; empty uses the provider's existing loopback default", default = "" }
LLM_TIMEOUT = { description = "Report generation read timeout in seconds, maximum 120", default = "120" }
LLM_CA_FILE = { description = "CA certificate file for a remote report LLM server", default = "" }
LLM_CLIENT_CERT_FILE = { description = "mTLS client certificate file for a remote report LLM server", default = "" }
LLM_CLIENT_KEY_FILE = { description = "Private mTLS client key file for a remote report LLM server", default = "" }
LX_DTYPES_KB_REGISTRY = { description = "Path to the governed lx-dtypes knowledge-base registry", default = "./data/terminology/registry.json" }
LX_DTYPES_TERMINOLOGY_IMPORT_ROOT = { description = "Local directory for validated terminology bundles unpacked from uploaded ZIP files", default = "./data/terminology/packages" }
WATCHER_POLL_INTERVAL_SECONDS = { description = "Watcher polling interval", default = "5" }
WATCHER_STABLE_AFTER_SECONDS = { description = "Minimum file age before watcher processing", default = "10" }

[profiles.development]
DJANGO_SETTINGS_MODULE = { description = "Settings module", default = "lx_annotate.settings.settings_dev" }
DJANGO_DEBUG = { default = "True" }
SERVE_WITH_NGINX = { default = "False" }
LOG_LEVEL = { default = "DEBUG" }

[profiles.production]
DJANGO_SETTINGS_MODULE = { description = "Settings module", default = "lx_annotate.settings.settings_prod" }
DJANGO_DEBUG = { default = "False" }
SERVE_WITH_NGINX = { default = "False" }
NGINX_PROTECTED_MEDIA_URL = { default = "/protected_media/" }
LOG_LEVEL = { default = "INFO" }

todo_responses:
- id: T01
  requirement: Reconcile execution evidence with the release under review. The 89 passing cases are inherited
    from the supplied 28 September manuscript. They were not rerun during this revision, and the original logs
    and companion YAML were not supplied. The October source revisions are distinct from that modified working
    tree and its installed dependencies.
  owner: corresponding author and test maintainer.
  tracking_criterion: verification_record
  response: Located the original companion evaluation YAML. Reran the eight named baseline modules in the current
    application environment (98 current cases) alongside candidate tests. Historical 89-case outcomes remain
    historical; original raw September logs and an immutable archive of that dirty baseline remain unavailable.
- id: T02
  requirement: Document the lawful processing and disclosure pathway. A favourable technical review does not
    itself authorize processing or public disclosure. Establish the relevant Article 6 basis and Article 9
    condition, applicable national research provisions, ethics conditions, transparency duties and any consent
    restrictions for each site and reuse purpose. Evaluate whether a DPIA is required and document the decision.
  owner: institutional controller, data-protection officer and research lead.
  tracking_criterion: institutional_release_approval
  response: Institutional controller/DPO assessment remains required. No legal basis, ethics permission or
    public-release authorization was supplied or inferred from passing tests.
- id: T03
  requirement: Refresh regulatory status and the audience-specific interpretation. Reference [7] is the July
    2026 consultation text, not a final standard. Check its status, intervening case law and the relevant institution’s
    interpretation at submission. Keeping a site secret private or withholding a lookup table alone does not
    establish anonymity for a recipient; public release requires a wider perspective than transfer to a named
    hub.
  owner: data-protection officer and legal reviewer.
  tracking_criterion: verification_record
  response: 'Verified the official EDPB consultation listing on 7 October 2026: Guidelines 02/2026 remain open
    for feedback through 30 October 2026. Institution-specific interpretation and intervening-case-law review
    remain legal-review work.'
- id: T04
  requirement: Validate the complete confidentiality boundary. File encryption does not establish protection
    of database fields such as extracted text, raw_meta and SensitiveMeta identifiers. Inventory all active
    storage policies, temporary files, swap, caches, backups, logs, browser state and parser call sites. Check
    actual key custody and the effect of compromised application privileges.
  owner: deployment and security maintainers.
  tracking_criterion: encrypted_consumption
  response: Candidate media and manifests are copied through real encrypted storage without filesystem plaintext
    materialization. Tests cover wrong keys, tampering, interruption and cleanup failure. Database fields,
    swap, browser state, caches, backups and deployment key custody remain outside this software evidence.
- id: T05
  requirement: Verify independent-node transport and recovery. The historical harness shares one database,
    mocks forwarding, disables the sender mutual-TLS requirement and simulates receiver proxy attestation.
    It does not establish live certificate negotiation, trusted proxy configuration, inter-node consistency
    or production recovery.
  owner: hub and deployment maintainers.
  tracking_criterion: manuscript_live_drills
  response: Inspected the user-selected gc-02 sender and gs-02 receiver. Receiver SSH works, but its migration
    service failed and Nginx/application are inactive. Sender certificate issuer failed and transfer worker
    is inactive. No live transfer, certificate rotation, interruption or acknowledgement-loss drill could proceed.
- id: T06
  requirement: Specify hash scope and mutation invariants. Confirm the end-to-end definition of each raw and
    processed digest, particularly authenticated plaintext versus ciphertext, video transcoding and processed
    PDFs. A content hash must not be described as a universal hash on every database row or as proof of clinical
    truth or anonymity.
  owner: media-ingestion and export maintainers.
  tracking_criterion: verification_record
  response: Existing local/encrypted file-hash tests pass in the 106-case backend run. The candidate additionally
    hashes the exact storage-decrypted bytes copied, verifies size and digest after encryption, and hashes
    only minimized released records. This is not universal database-row hashing or an anonymity claim.
- id: T07
  requirement: Make security-critical audit persistence mandatory. AuditLedger.save can skip an audit write
    when it interprets database errors as an unavailable ledger table. Identify operations that must fail closed
    if evidence cannot be written, and audit whether every relevant validation, override, identity change,
    export and release action enters the ledger atomically with its domain change.
  owner: audit and domain-service maintainers.
  tracking_criterion: audit_ledger/ledger_behavior (endoreg-db); institutional_release_approval (remaining
    policy)
  response: Removed suppressed AuditLedger save/identity-append failures; enclosing transactions now roll back
    on database errors. Candidate completion requires a persisted release_candidate_built audit entry. Fault
    injection and cleanup tests pass. Existing producers are enumerated in the audit runbook; exhaustive validation/override/erasure
    action coverage remains open.
- id: T08
  requirement: Validate audit ordering and tamper-evidence assumptions. Writers append through a locked head,
    while verify_chain orders by timestamp and UUID. Equal timestamps or timestamps assigned before lock acquisition
    may disagree with append order. Model-level save restrictions also leave bulk updates, direct SQL, deletion
    and recomputation of the whole chain in the threat model.
  owner: audit and security maintainers.
  tracking_criterion: audit_ledger/ledger_behavior (endoreg-db); institutional_release_approval (remaining
    policy)
  response: Chain verification follows stored predecessor hashes under the append-head lock and verifies the
    last-entry pointer and exhaustive membership. Added equal/backdated/concurrent append, deletion, orphan,
    head-corruption and missing-head rejection tests. No persisted hashes were rewritten. Independently protected
    checkpoints/signing against a privileged database writer remain unimplemented.
- id: T09
  requirement: Prove the intended identity-secret scope and lifecycle. The code resolves an installation setting
    or active keyring; centre.name is an input, rather than proof of an independently provisioned per-centre
    secret. Verify real deployment separation, secret entropy and permissions, recovery, compromise response
    and migration of every dependent pseudonym. Possession of the secret and plausible demographics permits
    recomputation.
  owner: identity and deployment maintainers.
  tracking_criterion: manuscript_identity_compatibility
  response: Existing identity-secret configuration and rotation tests pass. The user requested preserving migratable
    demographic identities. No live secret rotation, backup restore or per-center custody proof was performed;
    deployment separation remains unverified.
- id: T10
  requirement: Review the legacy demographic encoding and migration design. The implemented path hashes an
    undelimited concatenation, repeats the date of birth and then hashes the inner hexadecimal digest. Different
    tuples can have the same concatenated string. The HMAC fingerprint addresses some ambiguity checks, but
    the legacy pseudonym algorithm is not itself HMAC. A second SHA-256 does not resolve ambiguous input encoding
    or demographic guessability.
  owner: identity and cryptography reviewers.
  tracking_criterion: manuscript_identity_compatibility
  response: Per user direction, retained the demographic hash and migration compatibility. Existing HMAC ambiguity
    and wrong-salt guards were tested, including undelimited tuple ambiguity. No new persisted identity encoding
    or unreviewed cryptographic migration was introduced.
- id: T11
  requirement: Resolve demographic and same-day encounter collisions. Two individuals can share names and date
    of birth; two procedures for one patient can occur on the same day. The current examination input omits
    an encounter discriminator. A large hash space does not distinguish identical input tuples. Centre-name
    changes and source-name corrections also need explicit reconciliation.
  owner: clinical identity and ingestion maintainers.
  tracking_criterion: manuscript_identity_compatibility
  response: Per user direction, retain demographic matching and reject detected ambiguities for manual review.
    Existing fingerprint guards reject distinct tuples that encode to one legacy hash. Identical name/DOB inputs
    and same-day encounters cannot be distinguished by hashing alone; a clinical reconciliation policy remains
    necessary when such a case is reported.
- id: T12
  requirement: Verify identity commitment, correction and erasure. The inspected save logic contains provisional-state
    handling, legacy-identity guards and a direct-identifiers-cleared marker. The complete commit, correction,
    erasure and external-identifier pathways were not audited here. Verify that clearing identifiers preserves
    appropriate pseudonymous linkage and that identifiers cannot reappear through retries, caches, name lookup
    tables, logs or backups.
  owner: identity and privacy-workflow maintainers.
  tracking_criterion: manuscript_identity_compatibility
  response: Existing identity-erasure/legacy-enrollment and transactional rotation regressions pass. Did not
    change retained mappings or erase real identities. Complete cache/log/backup erasure and restore evidence
    remains an institutional/operational prerequisite.
- id: T13
  requirement: Separate display pseudonyms from linkage and clinical truth. Faker display names depend on the
    normalized hash, locale, gender input and generator behaviour; they need not be unique. The inspected metadata
    logic can also infer a missing gender from a name. Generated names and inferred attributes must not silently
    become scientific ground truth or public identity keys.
  owner: patient-model and frontend maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Public candidate metadata excludes display names and gender. Recorded installed Faker version for
    provenance. No changes to legacy pseudonym display generation or inferred-demographic clinical semantics;
    those paths still require a separate provenance review.
- id: T14
  requirement: Assess retained birth month and year. The pseudonymous profile samples a day within the original
    month/year and can draw the original day. It therefore retains substantial demographic information. Gender,
    centre, procedure date and rare findings can add identifying context. This perturbation is not a dataset-level
    anonymity determination.
  owner: privacy reviewer and scientific curator.
  tracking_criterion: release_metadata_and_splits
  response: Implemented the user-selected five-year age bands and omitted birth dates, exact ages, gender and
    calendar dates from candidate metadata. Requires curator-verified age at examination for exactly the selected
    videos; never guesses age from display pseudonyms. Boundary and invalid/missing-age tests pass. Media-level
    demographics and joint disclosure/utility evaluation remain open.
- id: T15
  requirement: Formalize workflow guards and recovery behaviour. Bourguet’s paper concerns multimodal interaction
    design, not clinical-data privacy or proof that this workflow is error-free. Formalize the LX-specific
    states, events, guards, overrides and recovery transitions. Verify backend enforcement independently of
    UI presentation.
  owner: workflow and test maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Candidate construction enforces saved membership, center authorization, existing review gates,
    timeline/byte consistency, encrypted staging, manifest verification and persisted audit completion. No
    public-distribution transition exists. Exhaustive state-machine/model-based testing across all annotation
    and retry paths remains open.
- id: T16
  requirement: Inventory the actual anonymization transformations. The supplied manuscript documents video
    masking/frame removal and PDF correction. This revision did not audit every automatic recognition, redaction
    and reprocessing call site or measure identifier removal. Identify the current lx-anonymizer/backend versions,
    model/configuration inputs, languages and supported device layouts, and confirm which outputs contain substitutions
    versus destructive redaction.
  owner: media-processing and anonymization maintainers.
  tracking_criterion: clinical_disclosure_evaluation
  response: Recorded installed lx-anonymizer 1.0.5 and dependency versions. The new packager performs no redaction
    or inferred anonymization. A device/language/model/configuration transformation inventory and measured
    removal/utility evaluation are still required.
- id: T17
  requirement: Test all recoverable release channels. Visible masking alone may leave identifiers in PDF text
    layers, incremental revisions, embedded objects, metadata, audio, thumbnails, filenames, subtitles, sidecars
    or archives. Test the actual distributed bytes and every permitted export format.
  owner: privacy-testing and export maintainers.
  tracking_criterion: clinical_disclosure_evaluation
  response: No claim of hidden-channel sanitization. V1 packages processed MP4 only; it does not sanitize audio,
    metadata or pixels, and does not package PDF hidden text or revisions. Public distribution stays unavailable
    until exact-byte, all-channel review is accepted.
- id: T18
  requirement: Define retention and re-identification routes. The institution may retain raw media, clinical
    records, mappings and secret material that enable local attribution. Direct-identifier erasure in one table
    does not remove these routes. Deletion, retention and publication are separate decisions, and operational
    logs or immutable audit payloads can themselves contain personal data.
  owner: institutional data steward and privacy reviewer.
  tracking_criterion: institutional_release_approval
  response: Kept source records and identity mappings unchanged. Candidate metadata omits direct and operational
    identifiers, while a protected audit event retains the split-plan reference. Institutional retention/erasure/backup
    policies and the re-identification-route matrix remain to be approved.
- id: T19
  requirement: Measure the performance of human privacy review. Completion of a review gate records a decision
    but does not quantify residual identifiers. Review effort, missed content and disagreement may vary with
    video length, layout, language and report structure. Define exactly what reviewers inspect and when a second
    review is required.
  owner: clinical review lead and evaluation team.
  tracking_criterion: clinical_disclosure_evaluation
  response: No approved clinical cohort, reference labels, review protocol or observations were supplied. Human-review
    sensitivity, disagreement and workload remain unmeasured.
- id: T20
  requirement: Validate annotation provenance and temporal remapping. Trimmed or removed frames can alter frame/time
    coordinates. Confirm that annotations remain aligned to the final processed artifact and that machine proposals,
    human acceptance, annotator identity and disagreement resolution survive export. Assess scientific utility
    after privacy transformations.
  owner: clinical annotation and export maintainers.
  tracking_criterion: clinical_disclosure_evaluation
  response: Candidate records bind frame/segment annotations to the packaged processed checksum and complete
    persisted presentation timestamps. Frame coordinates must match that timeline; prediction segments fail
    closed pending an explicit reviewed representation. All transformation paths, annotator/adjudication provenance
    and clinical utility remain outside this first candidate schema.
- id: T21
  requirement: Enforce patient-grouped partitions at export and training. The historical split tests concern
    membership construction and persistence. They do not establish downstream enforcement, immutable media/annotation
    content, cross-centre duplicate resolution, label balance or protection against preprocessing leakage.
  owner: dataset and model-evaluation maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Candidate creation enforces the persisted patient split, rejects stale patient/frame/annotation
    links, binds annotations/media to the manifest and rejects duplicate media digests. Tests cover disjoint
    folds and membership mutation. Existing model-training entrypoints and cross-site identity reconciliation
    are not integrated with the candidate manifest.
- id: T22
  requirement: Bind approvals to all material content changes. The selected baseline tests are not an exhaustive
    mutation-path audit. Check replacement, correction, segment edits, asynchronous jobs, override routes and
    time-of-check/time-of-use windows. Protect the reviewed version through final packaging and delivery.
  owner: workflow, storage and concurrency maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Candidate copies use database row locks, the existing media lease, exact-stream digest verification
    and immutable random destinations. Manifest and audit proof bind the frozen copied representation. Tests
    reject mutation/tampering and missing audit proof; this is not an exhaustive audit of every asynchronous
    writer or a deployed concurrency/performance claim.
- id: T23
  requirement: Inspect the exact hub metadata boundary. Transfer to an approved hub is not equivalent to unrestricted
    publication. Enumerate all identifiers, hashes, patient/video relationships, staff fields, source information
    and timestamps in the actual payload and receiver state. Check how external-id and pseudonymous mappings
    can be combined.
  owner: hub contract and privacy maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Kept governed hub payloads separate from the public candidate allowlist. Existing hub payload/envelope/replay
    tests pass. Did not redefine receiver permissions or assert that hub metadata is suitable for unrestricted
    publication; a receiver-specific field/access assessment remains required.
- id: T24
  requirement: Validate retention, restore and cleanup in deployment. The six recorded cleanup cases are local
    tests, not evidence of deployed retention or disaster recovery. Confirm source/derivative policy, verified
    receiver application, storage idleness, crash recovery, dry-run defaults and the interaction with backups
    and identity erasure.
  owner: storage and operations maintainers.
  tracking_criterion: manuscript_live_drills
  response: Live cleanup/restore drill blocked by the observed sender/receiver service failures. No production
    data, backups, certificates or keys were changed. Local cleanup tests remain local evidence, not disaster-recovery
    acceptance.
- id: T25
  requirement: Implement release-scoped identity and explicit field selection. The dedicated public-release
    allowlist and identifier layer are proposed here. Hash-derived internal identifiers, reused display names,
    source digests and shared stable identifiers can bridge releases or support dictionary/membership matching.
    Preserve only the relationships accepted by the release assessment.
  owner: publication-packager and privacy maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Implemented strict v1 processed-video candidate schema, random UUID4 release/patient/media identities,
    minimized labels and age bands, saved partitions, encrypted copies and a management command. Rebuilds produce
    independent IDs. Raw hashes, names, staff identifiers and operational timestamps are excluded. PDFs, approved
    label definitions, protected mapping policy, cross-release byte linkage assessment and public distribution
    remain open.
- id: T26
  requirement: Implement and verify the record-level publication manifest. The code demonstrates hashes for
    audit entries and selected artifacts; a digest for every released structured record is a proposed extension.
    Define canonicalization precisely, including Unicode, floating point, dates, nulls and schema evolution.
    Hash only the approved representation; publishing a digest of suppressed low-entropy content can disclose
    membership through guessing.
  owner: dataset and provenance maintainers.
  tracking_criterion: release_metadata_and_splits
  response: Implemented record/schema/release-bound canonical JSON hashes and a frozen manifest verified against
    an independently retained digest; verifies all media bytes, annotations and partition fields. Python/Node
    canonical vector matches. V1 deliberately excludes floats, arbitrary Unicode/free text and dates. No signing,

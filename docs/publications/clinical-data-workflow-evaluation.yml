paragraph_changes:
- paragraph_index: 0
  original: 'From clinical endoscopy data to publication-ready research resources: a governed workflow and
    registry template'
  revised: 'From clinical endoscopy data to research resources: implemented workflow gates and proposed publication
    controls'
- paragraph_index: 2
  original: Infrastructure manuscript | revised 14 September 2026
  revised: Infrastructure manuscript | evaluated and revised 28 September 2026 | LX-Annotate 1.3.13 / endoreg-db
    1.3.15
- paragraph_index: 6
  original: 'Methods: We conducted a bounded source and test inspection of LX-Annotate main and endoreg-db
    prototype, focusing on sender eligibility, typed transfer, receiver acknowledgement and failure handling.
    We distinguished executable test assertions from operational guidance and proposed release controls. No
    clinical dataset or deployment was tested for this article.'
  revised: 'Methods: We inspected the local LX-Annotate 1.3.13 working tree and installed endoreg-db 1.3.15
    and lx-dtypes 0.3.7 dependencies, and executed eight focused test modules covering sender eligibility,
    payload guards, envelope transfer, receiver acknowledgement, encrypted PDF consumption, patient-grouped
    splits and local cleanup. Existing uncommitted changes form part of the evaluated snapshot. No clinical
    dataset or production deployment was evaluated.'
- paragraph_index: 7
  original: 'Findings: The reviewed source includes negative-path payload checks and an in-process sender–receiver
    test that covers video delivery, report acknowledgement loss, replay conflict and denial of a missing mutual-TLS
    attestation. The test uses a single test database and mocked HTTP forwarding; these observations establish
    test coverage, not measured reliability in a deployed fleet.'
  revised: 'Findings: Across two focused runs, 89 tests passed without failures or skips. These include in-process
    sender–receiver scenarios for video delivery, report acknowledgement loss, changed replay rejection and
    missing mutual-TLS attestation; encrypted PDF materialization failure cases; and patient-grouped split
    invariants. The transfer harness uses one database and mocked HTTP forwarding. These results demonstrate
    the tested behaviors in the local test environment, not network certificate negotiation or reliability
    in a deployed fleet.'
- paragraph_index: 8
  original: 'Conclusion: The system implements separable review and transfer gates and offers testable artifact-continuity
    claims. Residual identifiers, clinical annotation quality, operational performance and public-release suitability
    remain unmeasured.'
  revised: 'Conclusion: The evaluated snapshot implements distinct review and transfer gates, tested artifact-integrity
    checks and persisted patient-grouped split plans. Residual identifiers, clinical annotation quality, operational
    performance and public-release suitability remain unevaluated. A public-release metadata policy, immutable
    release package and institutional authorization remain separate requirements.'
- paragraph_index: 14
  original: To make the strength of each statement inspectable, this manuscript uses three evidence classes.
    Repository-evidenced means that the reviewed snapshot contains corresponding implementation, tests or operational
    documentation. Proposed identifies a governance or publication control recommended by this manuscript but
    not established as implemented. Not evaluated identifies an outcome that requires empirical, legal, institutional
    or production evidence beyond source inspection. These labels constrain the claims throughout the paper.
  revised: This manuscript distinguishes source evidence, executed test evidence, proposed controls and unevaluated
    outcomes. Source evidence identifies an implementation or documented contract in the inspected snapshot;
    executed test evidence identifies the named local tests that passed. Proposed controls are not established
    as an enforced publication pathway. Clinical, legal and production outcomes require evidence beyond these
    source and test observations.
- paragraph_index: 16
  original: The application term “anonymization validation” denotes an operational human-review gate, not a
    legal determination that data are anonymous. The General Data Protection Regulation (GDPR) distinguishes
    pseudonymization, defined in Article 4(5), from information rendered anonymous; Recital 26 requires consideration
    of the means reasonably likely to be used for identification [4]. Historical Article 29 Working Party guidance
    assesses singling out, linkability and inference [5], and the European Data Protection Board’s 2026 consultation
    draft uses the corresponding criteria of record isolation, linkage and inference [7]. Because the controlled
    clinical environment preserves longitudinal relationships under reassigned pseudonyms and retains additional
    linkage information, its records remain pseudonymized personal data. Only the exact release dataset, evaluated
    in its recipient and disclosure context, can support a separate anonymity determination.
  revised: The application term “anonymization validation” denotes a human-review workflow gate, not a legal
    determination of anonymity. GDPR Article 4(5) defines pseudonymization, while Recital 26 addresses identification
    using means reasonably likely to be used [4]. Historical guidance discusses singling out, linkability and
    inference [5]. The EDPB consultation draft adopted on 7 July 2026 sets out No Record Isolation, No Linkage
    and No Inference criteria and assessment from relevant entities’ perspectives [7]. Where the clinical controller
    retains usable identity linkage, reassigned pseudonyms do not establish anonymity for that controller.
    The inspected data model supports longitudinal patient relationships; this review did not inspect actual
    records or determine their legal status. Any release needs an assessment of the exact data and intended
    disclosure context.
- paragraph_index: 20
  original: Managed file storage uses authenticated encryption with a fresh per-file data-encryption key. The
    long-lived local master key wraps these file keys and must remain local. Consumers obtain decrypted content
    through the storage interface or a scoped materialization helper, rather than passing ciphertext paths
    directly to video, PDF or model parsers.
  revised: The default application storage backend delegates to endoreg_db EncryptedStorage, which uses authenticated
    encryption and a fresh per-file data-encryption key wrapped by a local master key. Storage-mediated reads
    and scoped plaintext materialization are the supported consumption interfaces. Seven executed synthetic-PDF
    tests cover successful private materialization, ciphertext preservation, wrong-key and malformed or tampered
    input rejection, cleanup after a consumer exception and propagation of cleanup failure. They do not prove
    that every parser call site or every file on a deployed host follows this boundary.
- paragraph_index: 21
  original: 'The current hub guide and envelope module describe a Phase 2 transfer boundary: mutual TLS protects
    and authenticates the channel, while a per-transfer key encrypts standalone processed media and is wrapped
    for the receiving hub. Shared secrets authenticate requests and are not payload-encryption keys. KMS integration
    belongs to the architectural roadmap and is not claimed here as deployed functionality.'
  revised: The inspected hub envelope implementation provides Phase 2 encryption of standalone processed artifacts
    with a per-transfer key wrapped for the receiving hub. Sender settings require mutual TLS by default, but
    this requirement is configurable; the in-process transfer tests disable the sender requirement and simulate
    receiver proxy attestation. Consequently, this evaluation does not establish live channel authentication.
    Shared secrets serve request authentication rather than payload encryption. KMS integration remains an
    architectural roadmap item.
- paragraph_index: 43
  original: Annotation approval and required outside-segment mark for cleanup
  revised: Segment annotation approval; successful outside-segment cleanup is required for subsequent video
    export readiness
- paragraph_index: 62
  original: Video and PDF reports enter through the supported watcher or API intake pathways. Intake creates
    managed resources and workflow state under an assigned pseudonym.
  revised: Video and PDF intake is implemented through watcher and API pathways. The watcher delegates ingestion
    to endoreg_db services, including a distinct preanonymized intake path. Managed resources and patient or
    examination linkage are workflow outputs; merely accepting an upload is not evidence that its content is
    already pseudonymized or anonymization-validated.
- paragraph_index: 63
  original: Source-center and examination assignment preserve the context required for correct processing and
    authorized local linkage. Within the clinical boundary, this context may remain identifying when human
    validation fails. The publication workflow should retain only the relationships needed for its scientific
    purpose and keep identity linkage outside the release package. Collection purpose, lawful processing basis,
    ethics requirements and any consent conditions are established within the study by the institution before
    research use [4].
  revised: Source-center and examination assignment preserve processing context and authorized local linkage.
    This context can remain identifying even after successful per-media review where the controller can link
    it to an individual. A proposed publication workflow should retain only scientifically necessary relationships
    and exclude the clinical identity linkage. The institution must establish the applicable processing basis,
    ethics requirements and consent conditions before research use; their fulfillment was not assessed here
    [4].
- paragraph_index: 70
  original: The acceptance decision concerns the exact reviewed content. After correction, the reviewer compares
    the new result rather than inheriting approval from the earlier object. At dataset-release time, a separate
    review examines combinations of records and metadata that are not visible in a single-media review.
  revised: The intended acceptance decision concerns the reviewed content. Correction and artifact replacement
    require renewed review and export-readiness checks; the executed export tests cover selected integrity
    and rejection paths, not every frontend correction route. A separate dataset-release review must examine
    combinations of records and metadata beyond the single-media review.
- paragraph_index: 77
  original: This establishes byte-level continuity between approval and transfer. It does not prove clinical
    label accuracy or anonymity. Processed-artifact replacement or segment changes clear the readiness proof,
    requiring renewed promotion. Report transfer has its own validated anonymized text and processed-PDF checks;
    video-specific segment gates should not be generalized to reports.
  revised: The tested digest checks support byte-level continuity at the evaluated export boundaries. They
    do not measure label accuracy or anonymity, and do not constitute an exhaustive concurrency or mutation-path
    audit. The workflow requires renewed readiness after processed-artifact or segment changes. Report transfer
    has separate validated-state, anonymized-text and processed-PDF checks; video segment gates do not apply
    to reports.
- paragraph_index: 81
  original: Local cleanup remains a distinct decision after verified receipt, with retention of processed media
    documented as the conservative default. A failed or inconsistent acknowledgement cannot authorize deletion.
    Because transfer metadata can contain linkable research context, all hub-bound metadata still requires
    authorized handling even when the media has passed anonymization review.
  revised: Retention of local processed media remains the default. An implemented, bounded reaper can remove
    a local processed-video copy only under the explicit cleanup policy after verified apply, with receipt,
    digest, size and idle-media checks. It defaults to dry-run and does not reap raw media or processed reports.
    Six focused cleanup tests passed. This is local test evidence, not a deployed retention or disaster-recovery
    assessment. Hub-bound metadata can retain linkable research context and remains subject to authorized handling.
- paragraph_index: 86
  original: For machine-learning use, partitioning should occur at the patient level where authorized linkage
    permits, keeping related examinations and adjacent frames together. Preprocessing or selection based on
    the full dataset can also introduce leakage. These recommendations address known reproducibility concerns
    in machine-learning research [6]; their enforcement by the current export endpoints was not established.
  revised: The current application implements persisted patient-grouped split plans with a fixed test holdout
    and rotating validation folds. Thirteen tests passed for split construction, invalid input, membership
    validation and scoped API persistence. Missing or conflicting patient links are rejected. Ratios target
    patients rather than frames; membership snapshots freeze identifiers, not annotation content or media,
    and labels are not stratified. These plans do not by themselves enforce partition use in training or export,
    resolve duplicate identities across sites, or prevent preprocessing leakage [6]. Public-release identifiers,
    a field allowlist and an immutable release manifest remain proposed controls.
- paragraph_index: 111
  original: On 28 September 2026 we inspected LX-Annotate main and endoreg-db prototype through the named repository
    files in Appendix A. This is a purposive inspection of transfer-facing documentation and selected executable
    tests, not a systematic audit of all code paths. The extraction unit was a source file or test case; we
    recorded its boundary, asserted outcome and conditions that make an inference invalid. We did not execute
    the suites, inspect a clean deployment, sample clinical media or audit repository history. File-level content
    hashes in Appendix A identify the retrieved evidence; publication should additionally pin both full repository
    commits and dependency locks.
  revised: On 28 September 2026 we evaluated /home/admin/dev/lx-annotate on main at HEAD d4ffa63d9901f1305ba663e04ecde13db1bba2e0,
    with existing staged and unstaged changes. Both project metadata and the installed distribution report
    LX-Annotate 1.3.13; installed dependencies are endoreg-db 1.3.15 and lx-dtypes 0.3.7. We inspected selected
    workflow, storage and transfer paths and ran eight focused test modules. This was a purposive local evaluation,
    not a complete implementation audit or a test of a clean release. No separate endoreg-db prototype checkout
    or backend Git commit was established; the installed package is the evaluated dependency. The companion
    YAML records source hashes, dependency-lock hashes, commands, results and paragraph changes.
- paragraph_index: 113
  original: The sender guide specifies that video eligibility requires a nonempty processed artifact, separate
    validated anonymization and segments, an attributable export decision and agreement between persisted digests.
    It specifies a fresh digest check at marking and transfer. The payload-guard test module asserts rejection
    of raw-media transfer mode, incomplete sensitive metadata, non-anonymized state, inconsistent segment identity
    and invalid processed-file conditions. These are assertions present in source; the present inspection does
    not report an independently executed pass rate.
  revised: The current sender implementation checks processed-artifact availability, separate video review
    states, export readiness and persisted digest agreement; explicit marking and payload construction request
    fresh content verification. The focused run passed 30 payload-guard cases, 15 publication-readiness cases
    and 8 video-state cases. These exercise rejection and integrity behavior under their fixtures, including
    unreadable or changed media. They do not establish that a human reviewed every exported byte or that arbitrary
    concurrent modification is impossible.
- paragraph_index: 114
  original: The end-to-end test module feeds worker requests to Django receiver views in process. It asserts
    a video transfer with an envelope receipt, rejection before registration when mutual-TLS attestation is
    absent, and recovery from a lost report acknowledgement followed by rejection of a changed replay. Its
    class-level test setting disables the sender’s mutual-TLS requirement, while receiver-focused cases override
    receiver settings and simulate proxy attestation. It does not establish certificate negotiation over a
    network, independent databases, latency, throughput or production recovery.
  revised: All four sender–receiver test cases and six envelope tests passed locally. The transfer harness
    forwards worker requests to Django receiver views in process and exercises video delivery, report acknowledgement
    loss and retry, changed replay rejection, and missing receiver mutual-TLS attestation. Its class-level
    setting disables sender mutual TLS; receiver cases simulate proxy attestation. It uses one test database
    and mocked HTTP forwarding, so these results do not establish real certificate negotiation, independent-node
    consistency, throughput, latency or production recovery.
- paragraph_index: 115
  original: The endoreg-db prototype operations guide defines receiver-side node and center scoping, a proxy
    trust condition for mutual-TLS headers, a verified receipt and explicit quarantine and recovery steps.
    The presence of this runbook shows a documented operational contract; it does not establish that any particular
    installation satisfies the proxy, key, storage, backup or monitoring requirements.
  revised: The local hub guide references the endoreg-db receiver operations runbook for proxy trust, key rotation,
    storage, restore and quarantine procedures. That external runbook was not independently retrieved for this
    local revision, so its earlier prototype blob is not treated as current implementation evidence. Separately,
    seven encrypted-PDF materialization tests, thirteen patient-grouped split tests and six cleanup tests passed.
    None certifies a deployed proxy, key configuration, backup or monitoring system.
- paragraph_index: 117
  original: Source inspection identifies controls and test scenarios. Clinical and operational outcome claims
    require observations at the relevant boundary. The protocol below distinguishes those prospective measurements
    from the findings above. Prespecify thresholds, sampling frames, denominators and exclusions before collecting
    release evidence.
  revised: Executed tests support the bounded infrastructure findings above. Clinical and operational outcomes
    still require observations at the relevant boundary. The protocol below is prospective; prespecify thresholds,
    sampling frames, denominators and exclusions before collecting dataset-release evidence.
- paragraph_index: 146
  original: A zero-finding review does not demonstrate zero risk. It supports only the stated detection bound
    for the sampled artifacts and review method. Likewise, passing transfer tests establishes transport and
    integrity behavior, not privacy or clinical validity. These property-specific claims prevent evidence from
    one control from being used as a proxy for another.
  revised: A zero-finding review does not demonstrate zero risk; any detection bound depends on the sampling
    design and review sensitivity. Passing transfer tests establishes only the tested transport-contract and
    integrity behaviors, not clinical validity, anonymity or successful TLS negotiation in production.
- paragraph_index: 149
  original: The workflow’s main strength is the separation of privacy, annotation, integrity and transfer decisions.
    It provides a way to reason about exactly which artifact was reviewed, which clinical labels were accepted
    and whether the hub acknowledged the expected resource. This structure is useful for asynchronous processing
    because a completed task cannot silently stand in for a human approval.
  revised: The inspected workflow separates privacy review, annotation validation, export integrity and transfer
    decisions. Passing tests support selected gates and failure paths. That separation improves traceability
    in asynchronous processing, but the evaluation does not establish that all possible task, override or concurrency
    paths preserve every approval invariant.
- paragraph_index: 152
  original: This study is limited to a purposive documentation and source-test inspection, including an in-process
    test harness that represents both nodes within one database. We did not run the test suites, inspect full
    production configuration, measure identifier removal, assess label quality, perform a legal determination,
    conduct an independent two-node deployment trial or evaluate a completed dataset release. The proposed
    framework in Section 6.3 is a research agenda; none of its performance measures is presented as a result.
  revised: This evaluation is limited to selected source paths and 89 passing local tests in a modified working
    tree. The transfer harness represents sender and receiver in one database; encrypted-PDF tests use synthetic
    content. We did not run the complete backend or frontend suites, inspect production configuration, measure
    identifier removal or label quality, perform a legal determination, conduct an independent two-node trial
    or evaluate a completed dataset release. The prospective measurements in Section 6.3 are not reported as
    achieved outcomes.
- paragraph_index: 154
  original: LX-Annotate and endoreg_db provide inspectable review gates, payload guards and sender–receiver
    test scenarios for processed-media transfer. The observed evidence supports a bounded architecture and
    test-coverage description. Deployment validation, measured privacy and annotation outcomes, and a separate
    authorized release decision are needed before stronger scientific or public-dataset claims.
  revised: The evaluated LX-Annotate 1.3.13 snapshot with endoreg-db 1.3.15 provides review gates, tested payload

findings:
- Patient-grouped split plans are implemented, with membership-only snapshots; public release enforcement remains
  unestablished.
- Storage implementation is owned by installed endoreg-db; LX-Annotate retains compatibility exports.
- Sender mTLS is required by default but configurable; in-process tests are not certificate-negotiation evidence.
- A bounded local processed-video reaper exists; reports and raw media are outside its deletion scope.
- No clinical anonymization, annotation-quality, production reliability or institutional release outcome was
  measured.
- Earlier baseline and prototype blob references cannot identify the evaluated installed dependency.
- EDPB draft adoption corrected from 8 July to 7 July 2026.

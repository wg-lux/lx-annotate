- id: operator_acceptance
  category: operations
  title: Availability has observable service-level acceptance
  acceptance:
  - Operators can see the number of eligible tasks, locally decodable tasks, warming tasks, unavailable
    tasks, active decodes, throttled requests, and cache occupancy for the primary annotation dataset.
  - Alerts distinguish exhausted annotation work from a storage-placement, source-integrity, decoder-capacity,
    or authorization incident.
  - Restart and failure tests prove that in-flight work is idempotent, label submissions are not lost,
    and a failed source is never silently replaced with raw or cross-center media.
  - Production readiness includes repeated evidence under representative storage pressure and explicit
    review by application, storage, security, and clinical workflow owners.
  required: true
  verification:
    kind: manual
    instructions: Review dashboards and alerts, inject source and decoder failures, restart workers, and
      record repeated representative-load evidence with the named owners.
    timeout_seconds: 1200
  assessment:
    status: not_assessed
    evidence: []
- id: documented_availability_policy
  category: documentation
  title: Operators and annotators share one frame-availability policy
  acceptance:
  - English documentation explains that labels and dataset membership are primary data while decoded images
    are regenerable views backed by retained source artifacts.
  - The runbook records default and maximum decode concurrency, queue depth, retry delay, cache bytes,
    cache age, source-retention behavior, and the capacity signals that operators must monitor.
  - The user guide distinguishes no remaining annotation work from warming, throttled, unavailable, and
    failed frames and gives an actionable recovery path for each state.
  - Documentation states that raw media cannot be fetched from another node and that remote processed-media
    retrieval requires the deployment profile's approved authenticated transport.
  required: true
  verification:
    kind: manual
    instructions: Review the English API, user, and operator documentation against settings defaults,
      runtime behavior, monitoring, and security tests.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:

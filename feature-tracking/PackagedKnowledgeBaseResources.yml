  - Bootstrap output retains the selected exact module identity.
  required: true
  verification:
    kind: manual
    instructions: Review focused failure-path tests and bootstrap event output.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: /home/admin/lx-data-models/lx_dtypes/models/interface/tests/test_knowledge_base_resolver.py
    - kind: test
      reference: tests/system/test_terminology_bootstrap.py
    note: Distinct typed errors cover unknown providers, absent versions, catalog/config conflicts and

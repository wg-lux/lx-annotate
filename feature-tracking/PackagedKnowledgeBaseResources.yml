- id: maintained_documentation
  category: documentation
  title: The delivery contract documents stable resource ownership
  acceptance:
  - Documentation distinguishes immutable wheel providers from mutable filesystem sources.
  - Documentation prohibits persisting wheel installation paths.
  required: true
  verification:
    kind: manual
    instructions: Review terminology delivery documentation against the implemented registry schema.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/guides/terminology-delivery.md
    note: English delivery guide documents provider and filesystem ownership, digest behavior, and prohibition

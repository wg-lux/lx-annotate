- id: maintained_documentation
  category: documentation
  title: The delivery contract documents stable resource ownership
  acceptance:
  - Documentation distinguishes immutable wheel providers from mutable filesystem sources.
  - Documentation prohibits persisting wheel installation paths.
  required: true
  verification:
    kind: manual
    instructions: Review terminology delivery documentation against the implemented registry schema.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: /home/admin/lx-data-models/docs/guides/knowledge-base-authoring.md
    - kind: document
      reference: docs/guides/terminology-delivery.md
    note: Package and consumer guides assign strict bootstrap ownership to lx-dtypes, prohibit implicit
      Django registry mutation, and retain provider/filesystem source rules.
    assessed_by: codex-terminology-audit
    assessed_at: '2026-08-20T10:53:41.967193Z'
- id: replacement_observability
  category: operations
  title: Environment replacement failures are explicit and diagnosable

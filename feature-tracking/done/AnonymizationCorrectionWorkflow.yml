    instructions: Review control guards, error handling, and architecture-invariant impact.
    timeout_seconds: 180
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: frontend/src/components/Anonymizer/AnonymizationCorrectionComponent.vue
    note: Blackening is disabled until the validation-status response confirms complete validation and

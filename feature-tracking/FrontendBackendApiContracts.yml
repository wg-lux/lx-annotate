    - --prefix
    - frontend
    - run
    - test:unit
    - --
    - run
    - src/api/__tests__
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'frontend API tests: 151 passed'
    - kind: review
      reference: frontend/src/api/axiosInstance.ts and processing-history serializer boundary
    note: Segment-selector response fields match the backend schema exactly; processing history consumes
      backend download_url; JSON and binary interceptor behavior is covered.
    assessed_by: codex-api-contracts-20260825
    assessed_at: '2026-08-25T12:08:50.147537Z'

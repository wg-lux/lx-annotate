- id: fail_closed_contracts
  category: security
  title: Contract mismatches fail visibly
  acceptance:
  - Missing routes or incompatible payloads fail tests instead of using silent fallback data.
  - Backend-supplied media URLs are used instead of reconstructing unverified filesystem or download paths.
  required: true
  verification:
    kind: manual
    instructions: Review route resolution, payload parsing, and media URL handling.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: frontend auth, anonymization correction, validation, and video examination call sites
    note: Removed the nonexistent auth fallback and legacy mutation calls; media URLs are backend-supplied
      and same-origin checked; unsupported async correction responses fail explicitly.
    assessed_by: codex-api-contracts-20260825
    assessed_at: '2026-08-25T12:08:53.275408Z'

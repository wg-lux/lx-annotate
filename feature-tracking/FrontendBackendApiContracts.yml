    assessed_at: '2026-09-23T14:10:17.616985Z'
- id: request_payloads
  category: functionality
  title: Mutation payloads match backend input contracts
  acceptance:
  - Typed frontend request payloads map through camelCase-to-snake_case conversion to backend schema fields.
  - Multipart and binary bodies bypass JSON key conversion.
  - Anonymization start and status requests carry explicit video or pdf identity through the API and polling
    composable; synthetic overview identifiers never enter the media identity registry.
  - Queued video retries are reconciled against video rows only when a report shares the numeric identifier;
    rejected retries preserve annotation state and do not start polling.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - test:unit
    - --
    - run
    - src/api/__tests__
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'frontend API tests: 151 passed'
    - kind: command
      reference: 'tests/contracts/test_frontend_backend_api_contract.py: 9 passed'
    - kind: command
      reference: '2026-10-02: Vitest, fünf Dateien: 62 passed; API-Medienidentität 5, Registry 1, Store-Kollision/Wiederholung
        4, Quarantäne 4, Übersichtskomponente 48; vue-tsc --build --force und gezielter ESLint: Exit 0.'
    - kind: command
      reference: '2026-10-02 supervisor: Node 22.23.2, Vitest seven-file overview/API/registry/store cohort:
        101 passed; vue-tsc --build --force and scoped ESLint exit 0; git diff --check exit 0.'
    - kind: command
      reference: '2026-10-02 supervisor: endoreg-db full Pyright 0 errors, 9 existing warnings. SKIP_EXPENSIVE_TESTS=false
        RUN_VIDEO_TESTS=true .devenv/state/venv/bin/pytest tests/views/anonymization/test_anonymization_overview.py
        tests/services/test_anonymization_operational_recovery.py tests/services/test_reimport_upload_job_overview.py
        -q --tb=short: 90 passed, 4 warnings in 43.39s; isolated PostgreSQL 18.6 with its bin and libpq
        paths supplied after agent:sync.'
    note: Independent source review completed. Corrected queued-video reconciliation to require video
      identity; reproduced both collision directions before the fix. Updated the omitted legacy reimport
      tests for typed polling and separate repair/retry endpoints. Missing-source and durable lost rejections
      preserve annotation state and do not start polling. Source patch approved; production recovery and
      deployment were not performed.
    assessed_by: codex-overview-supervisor-20261002
    assessed_at: '2026-10-02T10:14:51.904391Z'
- id: response_payloads
  category: functionality
  title: Frontend response handling matches backend output contracts
  acceptance:

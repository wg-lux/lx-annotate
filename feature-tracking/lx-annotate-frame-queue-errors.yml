          - Browser UI reproduction, frame decoding, or annotation submission.
          - Production changes; local implementation is recorded below.

      local_remediation:
        date: '2026-09-15'
        status: implemented_and_regression_tested_not_deployed
        changes:
          - SQL label membership filtering and grouped distribution counts replace per-row relation queries.
          - Segment intervals are merged per video and label; frame matching uses sorted ranges and segment buckets are reused within a request.
          - A request-local sampler evaluates candidate eligibility once and samples without replacement, rechecking each selected frame.
          - Concurrent browser queue fetches share one request; selection changes and page unmount cancel obsolete requests.
          - Empty queues do not trigger automatic retry loops; validation errors do not trigger random fallback.
          - The existing label dropdown is preserved and incompatible known target/group selections show actionable feedback.
        verification:
          backend: RUN_VIDEO_TESTS=true pytest on bucket builders, frame annotation state and task endpoints passed 48 tests and 3 subtests with no skips.
          frontend: 56 focused tests passed across queue, legacy frame-task, page and usability suites.
          static: Full backend Pyright and scoped Ruff passed; frontend OpenAPI freshness, source type checking, full ESLint and component-test type checking passed.
          query_regressions:
            annotation_buckets: One query for both 1 and 101 annotation rows.
            label_distribution: Two queries for both 1 and 101 annotation rows.
            overlapping_segments: Fifty overlapping segments on one video require two queries.
            candidate_reuse: Prebuilt segment buckets require only the annotation membership query.
            sampling: Four selected frames require five queries; the candidate IN filter is evaluated once.
        remaining_validation:
          - Measure representative queue latency and memory on gc-10 with the installed fixed backend and frontend.
          - Confirm the observed ASGI timeout warnings do not recur under concurrent annotation use.
          - Candidate sets still occupy memory proportional to eligible dataset frames; local query-count tests are not a production-scale load test.
        readiness: /home/admin/dev/lx-annotate/feature-tracking/FrameAnnotationAvailability.yml

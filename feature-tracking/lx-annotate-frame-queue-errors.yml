        confirmed_code_defect: Label-group membership is queried once per annotation or segment row instead of once per group.
        likely_timeout_cause: Repeated membership queries and whole-dataset bucket construction before selecting ten tasks.
        additional_contributors: Repeated segment-bucket construction, nested segment/frame scans, and overlapping frontend queue requests.

      findings:
        - id: invalid_target_label_group_combination
          severity: high
          confidence: confirmed
          cause: The request retains target_label=cold_snare while selecting label_group_id=2.
          backend_behavior: _resolve_label_for_tasks filters labels by the selected group and rejects this combination before build_frame_task_queue runs.
          frontend_source_observation: FrameAnnotation.vue preserves an unavailable target label as a select option, and changing the group triggers queue loading without first resolving that incompatibility.
          operator_action:
            - For cold_snare, select group 1, as verified in this database, or deliberately choose a target label belonging to the intended group.
            - Group correction fixes the 400 only; the subsequent group-1 request can still hit the performance problem below.
          implementation:
            - Validate target and filter label membership against the loaded group catalog before fetching tasks.
            - When a group change makes a selected label invalid, require a compatible selection and show the field-level reason.
            - Do not silently clear the target into an unrestricted annotation queue or change the annotator/dataset scope.
            - Preserve the backend's strict validation and display its error/details in the queue UI.
          acceptance:
            - Switching from group 1/cold_snare to group 2 does not send an invalid queue request.
            - A deliberately invalid direct request still returns 400 with the offending field and group.

        - id: per_row_label_membership_queries
          severity: high
          confidence: code_defect_confirmed_timeout_attribution_probable
          owning_repository: endoreg-db
          functions:
            - models/state/frame_annotation.py::_label_allowed_by_set
            - models/state/frame_annotation.py::_build_dataset_label_distribution
            - models/state/frame_annotation.py::_build_annotation_frame_buckets
            - models/state/frame_annotation.py::_build_dataset_candidate_frame_ids
            - models/state/frame_annotation.py::_build_segment_frame_buckets
          cause: Each call to _label_allowed_by_set executes label_set.labels.filter(pk=label_id).exists(); row loops repeat it for labels already encountered.
          reproduction:
            method: Executed the unchanged membership and distribution functions in isolation with 1000 synthetic annotations sharing one label and a counting relation stub.
            rows: 1000
            distinct_labels: 1
            membership_filter_exists_calls: 1000
            result: Reproduced; no database access or production workload was used.
          scale_interpretation: All 284934 linked annotations have a frame and label, spanning only 11 labels. With the observed auto media mode, candidate construction alone would execute 284934 membership checks if it completes; other bucket passes repeat this work. This is a code-and-cardinality inference, not a captured production query trace.
          implementation:
            - Load the allowed label IDs once per queue request and use in-memory membership checks, or apply membership filtering in SQL before iteration.
            - Aggregate per-label distributions in SQL rather than instantiating every annotation for counts.
            - Retain dataset, source, annotator, label-group, and media eligibility boundaries in every optimized path.
          acceptance:
            - Query-count tests with repeated labels show a bounded membership-query count as annotation rows increase.
            - A scaled synthetic dataset comparable to 284934 annotations returns the same eligible tasks and distributions under an explicitly measured latency and memory budget.

        - id: repeated_unbounded_bucket_construction
          severity: high
          confidence: deployed_code_confirmed_runtime_contribution_unprofiled
          owning_repository: endoreg-db
          cause:
            - _build_queue_inputs constructs dataset-wide target, label, segment, annotation, and candidate collections before limiting task selection.
            - For balanced sampling it builds segment buckets directly and again through build_dataset_candidate_frame_ids.
            - _build_segment_frame_buckets loads frame IDs over each video's complete segment span and scans that frame collection once for every segment.
            - _pick_random_frame repeatedly counts an eligible queryset and fetches a random offset; large candidate sets become id__in inputs.
          implementation:
            - Reuse segment and annotation membership computed once within the request.
            - Use set-based interval joins, bounded candidate sampling, or an interval algorithm that avoids scanning every frame for every segment.
            - Avoid transferring the full frame corpus into Python merely to select ten tasks.
            - Measure actual query plans and preserve sampling semantics before changing indexes or sampling policy.
            - Keep frame-task metadata selection separate from image decoding and persistent frame generation.
          acceptance:
            - Test overlapping segments, repeated labels, empty datasets, extracted/virtual frames, and dataset/annotator exclusions.
            - Verify bounded query count, peak memory, and latency for the observed dataset scale.
            - Reject candidate implementations that silently broaden eligibility or change the requested target label.

        - id: overlapping_requests_and_incomplete_cancellation
          severity: medium
          confidence: overlapping_server_requests_observed_frontend_contribution_probable
          evidence: Two distinct requests with the same group-1 queue parameters were simultaneously represented in shutdown warnings.
          source_observation:
            - The installed FrameAnnotation.js task-fetch helper passes query parameters without an AbortSignal.
            - The local annotationQueue store guards prefetchIfNeeded but does not share a pending request across all direct fetchBatch calls.
            - loadNextTask can call fetchBatch, then popNextTask triggers prefetch even when the previous fetch produced no task.
            - Queue-generation checks prevent some stale responses from being applied but do not stop the underlying server work.
          implementation:
            - Share one pending task fetch per complete queue signature, including dataset, annotator, labels, media mode, and sampling options.
            - Cancel superseded HTTP requests on group/scope changes and component teardown.
            - Do not prefetch immediately after an unsuccessful empty fetch; distinguish validation failure, no eligible task, and transport failure.
            - Add a server-side work budget; client cancellation alone does not stop synchronous database or Python work.
          acceptance:
            - Concurrent prime, load, and prefetch calls for the same signature send one request.
            - Scope changes cannot publish stale tasks or errors into the new queue.
            - A 400 response does not trigger an immediate duplicate request with identical invalid parameters.

      repair_order:
        - Correct the incompatible label-group selection to remove the confirmed 400.
        - Fix per-row membership queries and repeated bucket construction in endoreg-db.
        - Add frontend request sharing, validation gating, and bounded failure handling in lx-annotate.
        - Verify with synthetic data at representative scale and a compatible installed wheel set before an authorized deployment.
        - After deployment, verify one controlled queue load and monitor request timing, query count, memory, and cancellation behavior.
        - Do not use service restarts, increased timeouts, or clearing annotations as substitutes for the identified repairs.


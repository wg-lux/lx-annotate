    timeout_seconds: 600
  assessment:
    status: not_assessed
- id: incident_evidence_and_runbook
  category: documentation
  title: Preserve incident evidence and repair instructions
  acceptance:
  - Correct the incompatible label-group selection to remove the confirmed 400.
  - Fix per-row membership queries and repeated bucket construction in endoreg-db.
  - Add frontend request sharing, validation gating, and bounded failure handling in lx-annotate.
  - Verify with synthetic data at representative scale and a compatible installed wheel set before an
    authorized deployment.
  - After deployment, verify one controlled queue load and monitor request timing, query count, memory,
    and cancellation behavior.
  - Do not use service restarts, increased timeouts, or clearing annotations as substitutes for the identified
    repairs.
  required: true
  verification:

  - Verify bounded query count, peak memory, and latency for the observed dataset scale.
  - Reject candidate implementations that silently broaden eligibility or change the requested target
    label.
  required: true
  verification:
    kind: manual
    instructions: Review against the preserved incident report and canonical FrameAnnotationAvailability.yml;

    timeout_seconds: 600
  assessment:
    status: not_assessed
- id: overlapping_requests_and_incomplete_cancellation
  category: functionality
  title: Overlapping requests and incomplete cancellation
  acceptance:
  - Concurrent prime, load, and prefetch calls for the same signature send one request.
  - Scope changes cannot publish stale tasks or errors into the new queue.
  - A 400 response does not trigger an immediate duplicate request with identical invalid parameters.
  required: true
  verification:
    kind: manual
    instructions: Review against the preserved incident report and canonical FrameAnnotationAvailability.yml;
      local tests alone do not establish production readiness.
    timeout_seconds: 600
  assessment:
    status: not_assessed
- id: incident_scope
  category: requirements
  title: Keep diagnosis within the confirmed incident scope
  acceptance:
  - An empty task queue was not established.
  - A frame decoder failure or Celery outage was not established as the cause.
  - The ASGI warning does not mean the entire web service was killed or restarted.
  required: true
  verification:
    kind: manual
    instructions: Review against the preserved incident report and canonical FrameAnnotationAvailability.yml;

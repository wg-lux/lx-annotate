    timeout_seconds: 600
  assessment:
    status: not_assessed
- id: production_validation
  category: operations
  title: Validate the installed repair before incident closure
  acceptance:
  - Measure representative queue latency and memory on gc-10 with the installed fixed backend and frontend.
  - Confirm the observed ASGI timeout warnings do not recur under concurrent annotation use.
  - Candidate sets still occupy memory proportional to eligible dataset frames; local query-count tests
    are not a production-scale load test.
  required: true
  verification:
    kind: manual
    instructions: Review against the preserved incident report and canonical FrameAnnotationAvailability.yml;

      verification:
        completed:
          - Privileged gc-10 service and journal reads succeeded.
          - Read-only database queries completed under a five-second statement timeout.
          - Authenticated incompatible-label replay returned the expected field-level 400.
          - Installed bucket and workflow source hashes matched the inspected local source.
          - Isolated 1000-row membership-query reproduction passed its assertions.
        not_performed:

schema_version: '1.0'
id: professional_application_readiness
name: Professional application readiness
description: Standardize the non-functional requirements that make lx-annotate predictable, resilient,
  secure, observable, accessible, performant, and maintainable in production.
owners:
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: AGENTS.md
  disposition: reference
  note: Repository-wide security, reliability, storage, and frontend workflow invariants.
definition_of_done:
- id: nonfunctional_requirements_contract
  category: requirements
  title: Production quality requirements are explicit and measurable
  acceptance:
  - Resilience, security and privacy, observability, accessibility, performance, data integrity, delivery
    quality, and maintainability are treated as release requirements rather than optional polish.
  - Each requirement has an owner, a reproducible verification method, and evidence that can be reviewed
    independently of subjective completion percentages.
  - Production readiness is blocked when a required criterion is unverified, even when the application
    happy path works.
  required: true
  verification:
    kind: manual
    instructions: 'Review the feature definition, ownership, acceptance statements, and readiness policy
      for complete coverage and measurable release gates. Accountable owner: lx-annotate maintainers.
      Responsible role: Maintainers acting as release assessors. Follow docs/guides/professional-application-readiness.yml
      requirements.nonfunctional_requirements_contract and its pass condition; retain evidence for every
      acceptance statement.'
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.nonfunctional_requirements_contract
    - kind: test
      reference: '2026-09-28: feature-tracking/test_tracker.py, 16 passed within the 95-pass focused backend
        run; incomplete readiness check and done policy covered.'
    note: All ten required criteria are mapped to accountable ownership, reproducible procedures and explicit
      pass conditions in the YAML guide. Missing numerical performance budgets are explicitly blocking,
      not replaced with invented targets.
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:22:30.415137Z'
- id: resilient_error_handling
  category: functionality
  title: Failures are recoverable and actionable
  acceptance:
  - Network drops, API timeouts, invalid inputs, and server errors produce stable user-facing error states
    rather than crashes or cryptic technical output.
  - Failed operations preserve safe user state, identify whether retry or correction is appropriate, and
    do not silently discard unsaved work.
  - Anonymization validation fields survive correction navigation and return for the same media type and
    source file, including empty edits and case selections. Drafts remain in memory only, are isolated
    from other files and accounts, and clear after successful approval.
  - Successful acceptance also clears the matching resume destination in the mounted sidebar and session
    storage. Failed acceptance preserves it; accepting a different file does not clear a newer target.
  - Retry, cancellation, timeout, and stale-response behavior is deterministic and does not duplicate
    mutations.
  required: true
  verification:
    kind: manual
    instructions: 'Review error boundaries and request lifecycle code; run focused negative-path tests
      for timeout, malformed input, retry, cancellation, and stale responses. Accountable owner: lx-annotate
      maintainers. Responsible role: Frontend and API maintainers. Follow docs/guides/professional-application-readiness.yml
      requirements.resilient_error_handling and its pass condition; retain evidence for every acceptance
      statement.'
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: '2026-09-28: AnonymizationValidationComponent.test.ts (39 passed) and AnonymizationCorrectionComponent.test.ts
        (5 passed), including seven new draft lifecycle regressions; focused ESLint passed.'
    - kind: code
      reference: frontend/src/stores/anonymizationValidationDraftStore.ts and frontend/src/components/Anonymizer/AnonymizationValidationComponent.vue
    - kind: command
      reference: '2026-09-28: vue-tsc --build --force and vue-tsc --noEmit -p tsconfig.component-tests.json
        both exit 0; scoped ESLint, git diff --check and tracker validate pass.'
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.resilient_error_handling
    - kind: command
      reference: '2026-09-28: npm --prefix frontend run test:unit -- --run; 153 files and 1248 tests passed,
        exit 0.'
    - kind: test
      reference: '2026-09-28 acceptance cleanup follow-up: 111 tests pass across SidebarComponent.workflow
        (16), SidebarComponent.routes (5), AnonymizationValidationComponent (39), AnonymizationOverviewComponent
        (46), and AnonymizationCorrectionComponent (5). Matching draft and reactive sidebar resume target
        clear on successful approval; failed approval and unrelated targets remain intact. Both frontend
        TypeScript checks and scoped ESLint pass.'
    assessed_by: codex-anonymization-preserve-20260928
    assessed_at: '2026-09-28T13:05:25.663682Z'
- id: security_privacy
  category: security
  title: Security and privacy are enforced by default
  acceptance:
  - Sensitive data is encrypted at rest and protected in transit with the deployment-required transport
    security; long-lived master keys are never transmitted or stored in application configuration.
  - Authentication, authorization, input validation, output sanitization, and least-privilege boundaries
    are enforced at every relevant API and UI boundary.
  - Protected artifacts are consumed through authenticated decryption and scoped plaintext materialization,
    with fail-closed behavior for missing keys, tampering, malformed headers, and cleanup failures.
  required: true
  verification:
    kind: manual
    instructions: 'Perform a security review of transport, secret handling, authorization, validation,
      encrypted artifact consumption, and negative-path tests against the repository security invariants.
      Accountable owner: lx-annotate maintainers. Responsible role: Backend/storage maintainers with the
      LuxNix deployment operator. Follow docs/guides/professional-application-readiness.yml requirements.security_privacy
      and its pass condition; retain evidence for every acceptance statement.'
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.security_privacy
    - kind: command
      reference: '2026-09-28: guide focused_backend command plus feature-tracking/test_tracker.py; 95
        passed, exit 0 (monitoring, cancellation, encrypted storage/materialization, hub transfer security
        and tracker policy).'
    note: Focused encrypted storage, scoped materialization, tamper/cleanup rejection and transfer authorization
      tests pass. Comprehensive API/consumer review and deployment-required transport/key-identity evidence
      remain unverified; no host acceptance performed.
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:22:30.415260Z'
- id: observability_telemetry
  category: observability
  title: Runtime behavior is diagnosable without exposing secrets
  acceptance:
  - Application errors, background-job failures, key workflow transitions, and performance regressions
    emit structured, privacy-safe diagnostics with correlation context.
  - Crash reporting, logs, health signals, and operational metrics distinguish user errors, dependency
    failures, authorization failures, and internal defects.
  - Telemetry is bounded, access-controlled, retention-aware, and excludes secrets, plaintext protected
    payloads, and unnecessary clinical identifiers.
  required: true
  verification:
    kind: manual
    instructions: 'Review logging and monitoring contracts; exercise representative failures and confirm
      that diagnostics are actionable, correlated, privacy-safe, and visible to operators. Accountable
      owner: lx-annotate maintainers. Responsible role: Application maintainers with the monitoring operator.
      Follow docs/guides/professional-application-readiness.yml requirements.observability_telemetry and
      its pass condition; retain evidence for every acceptance statement.'
    timeout_seconds: 900
  assessment:
    status: blocked
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.observability_telemetry
    - kind: command
      reference: '2026-09-28: guide focused_backend command plus feature-tracking/test_tracker.py; 95
        passed, exit 0 (monitoring, cancellation, encrypted storage/materialization, hub transfer security
        and tracker policy).'
    note: Production Vite removes console output used by runtimeLogger. No reviewed production browser
      crash destination, end-to-end correlation, retention/volume policy or alert routing evidence. Monitoring
      tests alone do not satisfy this criterion.
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:22:30.415298Z'
- id: design_system_accessibility
  category: functionality
  title: The interface is consistent and accessible
  acceptance:
  - Shared design tokens and components provide consistent hierarchy, spacing, typography, color semantics,
    loading states, empty states, and error presentation.
  - Core workflows support keyboard navigation, visible focus, screen readers, semantic structure, sufficient
    contrast, and accessible names and descriptions.
  - Accessibility behavior and responsive states are covered by automated checks and focused user-interface
    tests for the highest-risk workflows.
  required: true
  verification:
    kind: manual
    instructions: 'Review the design-system usage and test representative workflows with keyboard and
      screen-reader semantics; run the repository accessibility and UI test gates. Accountable owner:
      lx-annotate maintainers. Responsible role: Frontend maintainers with a workflow reviewer. Follow
      docs/guides/professional-application-readiness.yml requirements.design_system_accessibility and
      its pass condition; retain evidence for every acceptance statement.'
    timeout_seconds: 900
  assessment:
    status: blocked
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.design_system_accessibility
    - kind: command
      reference: '2026-09-28: npm --prefix frontend run test:unit -- --run; 153 files and 1248 tests passed,
        exit 0.'
    note: Component semantics and keyboard regressions pass, but no dedicated automated accessibility
      gate or recorded real-browser keyboard, screen-reader, contrast and responsive acceptance for core
      workflows was found.
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:22:30.415331Z'
- id: performance_responsiveness
  category: operations
  title: The application remains responsive under realistic conditions
  acceptance:
  - Loading, refresh, mutation, and offline or degraded-network states provide immediate and truthful
    feedback through appropriate skeleton, progress, or pending states.
  - Request, render, and asset-loading behavior uses bounded concurrency, safe caching, and deduplication
    without serving stale data as current.
  - Performance budgets and representative slow-network or low-resource checks detect regressions in startup,
    critical workflows, and interaction latency.
  required: true
  verification:
    kind: manual
    instructions: 'Review performance-sensitive paths and caching policies; run production builds and
      representative slow-network, repeated-request, and interaction-performance checks. Accountable owner:
      lx-annotate maintainers. Responsible role: Frontend/API maintainers with the deployment operator.
      Follow docs/guides/professional-application-readiness.yml requirements.performance_responsiveness
      and its pass condition; retain evidence for every acceptance statement.'
    timeout_seconds: 900
  assessment:
    status: blocked
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.performance_responsiveness
    note: Representative hardware/network/dataset profile and owner-approved numerical startup/workflow/interaction
      budgets are missing. Requested these inputs; unit-test durations cannot serve as product latency
      evidence.
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:22:30.415362Z'
- id: deterministic_data_integrity
  category: data_integrity
  title: State transitions and mutations are deterministic
  acceptance:
  - State ownership, request identity, ordering, and invalidation rules prevent race conditions, ghost
    reads, stale overwrites, and contradictory UI states.
  - Mutations are idempotent or protected against double submission, and authoritative success or failure
    is represented before dependent actions proceed.
  - Persisted JSON, workflow, provenance, and storage-routing data are validated through typed contracts
    at system boundaries.
  required: true
  verification:
    kind: manual
    instructions: 'Review state and mutation boundaries against backend contracts and typed persistence
      rules; run concurrency, duplicate-submit, stale-response, and round-trip integrity tests. Accountable
      owner: lx-annotate maintainers. Responsible role: API, frontend state and data-model maintainers.
      Follow docs/guides/professional-application-readiness.yml requirements.deterministic_data_integrity
      and its pass condition; retain evidence for every acceptance statement.'
    timeout_seconds: 1200
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.deterministic_data_integrity
    - kind: command
      reference: '2026-09-28: npm --prefix frontend run test:unit -- --run; 153 files and 1248 tests passed,
        exit 0.'
    note: Frontend suite covers stale requests, pending mutations and annotation draft isolation; complete
      backend persisted-schema and mutation-idempotency audit remains outstanding.
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:22:30.415404Z'
- id: automated_delivery_quality
  category: testing
  title: Changes are protected by automated quality gates
  acceptance:
  - Unit, integration, API, and end-to-end tests cover happy paths, failure paths, authorization boundaries,
    accessibility-critical flows, and data-integrity invariants.
  - CI runs formatting, linting, type checking, security-sensitive checks, migrations or contract checks,
    and the relevant test suites on supported environments.
  - Release automation is reproducible, verifies artifacts and provenance, supports safe rollback, and
    fails closed when required checks or deployment inputs are missing.
  required: true
  verification:
    kind: manual
    instructions: 'Inspect CI/CD workflow definitions and run the complete applicable quality gates, including
      failure-path and release-artifact verification. Accountable owner: lx-annotate maintainers. Responsible
      role: Maintainers responsible for CI and releases. Follow docs/guides/professional-application-readiness.yml
      requirements.automated_delivery_quality and its pass condition; retain evidence for every acceptance
      statement.'
    timeout_seconds: 1200
  assessment:
    status: blocked
    evidence:
    - kind: document
      reference: docs/guides/professional-application-readiness.yml requirements.automated_delivery_quality
    - kind: document
      reference: docs/guides/professional-application-readiness.yml verification_record
    note: 'Local delivery fixes are verified: restored real manage.py dispatch, added unknown-command
      regression, regenerated stale API artifacts, updated the installed GET/DELETE route contract, fixed
      all six mypy errors and one lint error, and added CI tracker gates. Frontend and focused backend
      reruns pass. The broad run had 1080 passed, 6 skipped and one subsequently fixed contract failure
      with 85.31% coverage; it was not rerun after final fixes. Browser end-to-end/accessibility, skipped
      build cases and release/host evidence still block complete acceptance.'
    assessed_by: codex-professional-readiness-20260928
    assessed_at: '2026-09-28T12:27:41.524457Z'
- id: maintainability_documentation

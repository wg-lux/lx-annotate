    state, security, and lifecycle semantics.
  - Documentation explains setup, configuration, deployment, troubleshooting, recovery, accessibility
    expectations, and limitations in English.
  - New behavior includes focused tests and reviewable evidence so another maintainer can reproduce, operate,
    and safely change it.
  required: true
  verification:
    kind: manual
    instructions: 'Review changed modules, public contracts, tests, and operator or contributor documentation

      report_llm imports ReportVerbosity, absent from installed lx-dtypes 0.3.1. No import fallback, test
      skip or dependency contract weakening was introduced.'
    assessed_by: codex-infrastructure-manuscript-20260910
    assessed_at: '2026-09-10T07:49:46.937297Z'
- id: release_metadata_and_splits
  category: requirements
  title: Public release schema and patient-disjoint split policy are implemented
  acceptance:
  - Public-release metadata allowlist, dataset-scoped identifiers, patient-disjoint partitions and immutable
    release manifest require a separately defined and reviewed contract; training exports are not public-release
    approval.
  required: true
  verification:
    kind: manual
    instructions: Public-release metadata allowlist, dataset-scoped identifiers, patient-disjoint partitions
      and immutable release manifest require a separately defined and reviewed contract; training exports
      are not public-release approval.
    timeout_seconds: 300
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: docs/publications/clinical-data-workflow.yml Sections 4.7 and 5; docs/guides/ai-training-data-export.md
        documents internal identifiers, annotators and timestamps in research exports.
    note: The manuscript proposes a public-release workflow, but the reviewed training exports are not
      evidence of an implemented public-release policy. A reviewed field allowlist, identifier/linkage
      contract, partition policy and release authorization model are needed before implementation-specific
      acceptance tests can be defined.
    assessed_by: codex-infrastructure-manuscript-20260910
    assessed_at: '2026-09-10T07:49:48.524588Z'

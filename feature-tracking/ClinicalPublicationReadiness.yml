        technical export from public release authorization.
    note: No dataset-specific institutional release authorization was supplied. Software tests cannot
      grant ethics, consent, licensing or publication approval.
    assessed_by: codex-infrastructure-manuscript-20260910
    assessed_at: '2026-09-10T07:49:51.616742Z'
- id: verification_record
  category: documentation
  title: Exact verification results and remaining blockers are recorded
  acceptance:
  - Record regression results, assessor and limits without implying clinical publication approval.
  required: true
  verification:
    kind: manual
    instructions: Review this feature file against executed test output.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: Ruff check passed for both new test modules and both changed hub modules; git diff --check
        passed for production changes; final test run 112 passed, 19 blocked by an existing import mismatch.
    - kind: document
      reference: docs/publications/infrastructure-software-evaluation.yml
    note: Records 44 final audit tests, 106 backend tests plus 4 subtests, 114 application integration

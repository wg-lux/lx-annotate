schema_version: '1.0'
id: reporting_shell_race_conditions
name: Reporting Shell Terminology And Template Race Conditions
description: |-
  Graph-based analysis of ReportingShell evaluation, with emphasis on the
  distinction between a patient-examination's persisted knowledge-base identity
  and the mutable process-wide active terminology selection.

  ```mermaid
  flowchart TD
    U["Route or terminology event"] --> C["Freeze evaluation token: generation, examination, module, version, bundle key, pinned identity"]
    C --> K["Kahn cycle validation and immutable wave plan"]
    K --> W0["Wave 0: patient-examination detail"]
    W0 --> X{"Pinned identity equals evaluation token?"}
    X -- no --> FF["Fail closed: no template discovery and no state commit"]
    X -- yes --> W1A["Wave 1A: version-qualified template graph"]
    X -- yes --> W1B["Wave 1B: version-qualified finding catalog"]
    W1A --> BAR["Promise.all barrier"]
    W1B --> BAR
    BAR --> W2["Wave 2: pure draft resolution"]
    W2 --> CUR{"Token still current?"}
    CUR -- no --> DROP["Discard superseded evaluation"]
    CUR -- yes --> COMMIT["One synchronous Vue/Pinia commit"]

    NONE["No published template"] --> AO["Annotation-only draft pinned to token identity"]
    AO --> SW["User changes terminology later"]
    SW --> BLOCK["Keep original identity; mark persistence blocked"]

    FC["Background catalog response"] --> FG{"Generation, examination, and bundle key match?"}
    FG -- no --> DROP
    FG -- yes --> COMMIT
    TB["Builder list/detail response"] --> TG{"Generation, examination, module, version, and response identity match?"}
    TG -- no --> DROP
    TG -- yes --> COMMIT

    UI["User explicitly selects bundle"] --> REV["Read registry revision"]
    REV --> CAS["Select with expected_revision under file lock"]
    CAS -->|revision matches| S["Atomic replace, new revision, cache clear"]
    CAS -->|409 conflict| RELOAD["Reload current selection; require explicit retry"]
    E["Template list, detail, preview, validation, publish, unpublish"] --> EV["Require exact version in URL"]
    EV --> ID["Backend verifies loaded module and version"]
    NR["No registry, blank version, or unavailable template"] --> FCLOSED["Explicit failure or annotation-only state"]
    EX["Installed report_template_examples"] -. "example data only; never implicit resolver fallback" .-> FCLOSED

    C -.-> M2["F2 mitigated: immutable identity and strict mismatch"]
    SW -.-> M5["F5 mitigated: hydration never auto-selects global bundle"]
    FG -.-> M6["F6 mitigated: bundle-aware commit guard"]
    TG -.-> M7["F7 mitigated: stale builder response guard"]
    CAS -.-> M1["F1 mitigated: serialized revision CAS"]
    EV -.-> M3["F3 mitigated: all template operations version-qualified"]
    FCLOSED -.-> M4["F4 mitigated: example fallback removed"]

    classDef mitigated fill:#d3f9d8,stroke:#2b8a3e,color:#123d1b;
    class M1,M2,M3,M4,M5,M6,M7 mitigated;
  ```

  The active registry pointer remains an explicitly deployment-wide preference,
  but selection is serialized with a revision compare-and-swap contract. A
  conflict reloads the winning state and requires a new explicit user action;
  it is never retried automatically. Existing evaluations remain pinned to their
  immutable module and version and therefore do not follow later preference changes.

  Construction notes: ReportingShell now validates and executes an immutable
  DAG in three waves. Only the final guarded commit mutates Vue/Pinia state.
  Production bootstraps a registry of immutable
  packaged providers. Versioned resolution without a configured registry or
  explicit source directories now fails closed. report_template_examples remains
  packaged test/example data but is not an implicit clinical resolver or builder
  fallback. Every template route and builder mutation requires the exact version.
owners:
- lx-annotate frontend maintainers
- lx-dtypes maintainers

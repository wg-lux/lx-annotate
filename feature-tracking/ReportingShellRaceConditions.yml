schema_version: '1.0'
id: reporting_shell_race_conditions
name: Reporting Shell Terminology And Template Race Conditions
description: "Graph-based analysis of ReportingShell evaluation, with emphasis on the\ndistinction between\
  \ a patient-examination's persisted knowledge-base identity\nand the mutable process-wide active terminology\
  \ selection.\n\n```mermaid\nflowchart TD\n  U[\"Route or terminology event\"] --> C[\"Freeze evaluation\
  \ token: generation, examination, module, version, bundle key, pinned identity\"]\n  C --> K[\"Kahn\
  \ cycle validation and immutable wave plan\"]\n  K --> W0[\"Wave 0: patient-examination detail\"]\n\
  \  W0 --> X{\"Pinned identity equals evaluation token?\"}\n  X -- no --> FF[\"Fail closed: no template\
  \ discovery and no state commit\"]\n  X -- yes --> W1A[\"Wave 1A: version-qualified template graph\"\
  ]\n  X -- yes --> W1B[\"Wave 1B: version-qualified finding catalog\"]\n  W1A --> BAR[\"Promise.all barrier\"\
  ]\n  W1B --> BAR\n  BAR --> W2[\"Wave 2: pure draft resolution\"]\n  W2 --> CUR{\"Token still current?\"\
  }\n  CUR -- no --> DROP[\"Discard superseded evaluation\"]\n  CUR -- yes --> COMMIT[\"One synchronous\
  \ Vue/Pinia commit\"]\n\n  NONE[\"No published template\"] --> AO[\"Annotation-only draft pinned to\
  \ token identity\"]\n  AO --> SW[\"User changes terminology later\"]\n  SW --> BLOCK[\"Keep original\
  \ identity; mark persistence blocked\"]\n\n  FC[\"Background catalog response\"] --> FG{\"Generation,\
  \ examination, and bundle key match?\"}\n  FG -- no --> DROP\n  FG -- yes --> COMMIT\n  TB[\"Builder\
  \ list/detail response\"] --> TG{\"Generation, examination, module, version, and response identity match?\"\
  }\n  TG -- no --> DROP\n  TG -- yes --> COMMIT\n\n  UI[\"User explicitly selects bundle\"] --> REV[\"\
  Read registry revision\"]\n  REV --> CAS[\"Select with expected_revision under file lock\"]\n  CAS -->|revision\
  \ matches| S[\"Atomic replace, new revision, cache clear\"]\n  CAS -->|409 conflict| RELOAD[\"Reload\
  \ current selection; require explicit retry\"]\n  E[\"Template list, detail, preview, validation, publish,\
  \ unpublish\"] --> EV[\"Require exact version in URL\"]\n  EV --> ID[\"Backend verifies loaded module\
  \ and version\"]\n  NR[\"No registry, blank version, or unavailable template\"] --> FCLOSED[\"Explicit\
  \ failure or annotation-only state\"]\n  EX[\"Installed report_template_examples\"] -. \"example data\
  \ only; never implicit resolver fallback\" .-> FCLOSED\n\n  C -.-> M2[\"F2 mitigated: immutable identity\
  \ and strict mismatch\"]\n  SW -.-> M5[\"F5 mitigated: hydration never auto-selects global bundle\"\
  ]\n  FG -.-> M6[\"F6 mitigated: bundle-aware commit guard\"]\n  TG -.-> M7[\"F7 mitigated: stale builder\
  \ response guard\"]\n  CAS -.-> M1[\"F1 mitigated: serialized revision CAS\"]\n  EV -.-> M3[\"F3 mitigated:\
  \ all template operations version-qualified\"]\n  FCLOSED -.-> M4[\"F4 mitigated: example fallback removed\"\
  ]\n\n  classDef mitigated fill:#d3f9d8,stroke:#2b8a3e,color:#123d1b;\n  class M1,M2,M3,M4,M5,M6,M7 mitigated;\n\
  ```\n\nThe active registry pointer remains an explicitly deployment-wide preference,\nbut selection\
  \ is serialized with a revision compare-and-swap contract. A\nconflict reloads the winning state and\
  \ requires a new explicit user action;\nit is never retried automatically. Existing evaluations remain\
  \ pinned to their\nimmutable module and version and therefore do not follow later preference changes.\n\
  \nConstruction notes: ReportingShell now validates and executes an immutable\nDAG in three waves. Only\
  \ the final guarded commit mutates Vue/Pinia state.\nProduction bootstraps a registry of immutable\n\
  packaged providers. Versioned resolution without a configured registry or\nexplicit source directories\
  \ now fails closed. report_template_examples remains\npackaged test/example data but is not an implicit\
  \ clinical resolver or builder\nfallback. Every template route and builder mutation requires the exact\
  \ version."
owners:
- lx-annotate frontend maintainers
- lx-dtypes maintainers
production_critical: true

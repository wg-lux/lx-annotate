    note: Reviewed the separate Studienkohorte mode, reviewed-filter summary, workbook cohort metadata,
      exact-snapshot semantics, and distinct cohort filename.
    assessed_by: codex-export-grouping-20260828
    assessed_at: '2026-08-28T11:12:14.538827Z'
- id: bounded_operation
  category: operations
  title: Workbook generation is bounded and leaves no server-side artifact
  acceptance:
  - The export enforces a documented maximum row count and fails visibly when exceeded.
  - XLSX bytes are returned directly without persisting a plaintext workbook on the server.
  required: true
  verification:

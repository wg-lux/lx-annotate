    note: Full frontend OpenAPI freshness, Vue TypeScript build, and repository ESLint completed successfully;
      scoped Pyright and Ruff pass.
    assessed_by: codex-filtered-case-xlsx
    assessed_at: '2026-08-27T14:26:21.820463Z'
- id: authorization
  category: security
  title: Export access uses the existing patient-read authorization boundary
  acceptance:

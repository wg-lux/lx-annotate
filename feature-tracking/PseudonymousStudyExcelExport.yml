    assessed_at: '2026-08-27T14:26:24.343851Z'
- id: scope_documentation
  category: documentation
  title: Export behavior is explicit in code and UI language
  acceptance:
  - The workbook identifies its pseudonymous scope and active filter criteria.
  - UI labels distinguish this case-list export from the training-data segment export.
  required: true
  verification:
    kind: manual
    instructions: Review the export component labels, workbook sheets, and response filename.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: frontend/src/components/Export/CaseStudyExcelExport.vue and lx_annotate/views/study_export.py
    note: Reviewed UI labels, two workbook sheets, pseudonymous metadata, filter semantics, response headers,
      and filename.
    assessed_by: codex-filtered-case-xlsx
    assessed_at: '2026-08-27T14:26:27.209014Z'
- id: bounded_operation
  category: operations
  title: Workbook generation is bounded and leaves no server-side artifact
  acceptance:
  - The export enforces a documented maximum row count and fails visibly when exceeded.
  - XLSX bytes are returned directly without persisting a plaintext workbook on the server.
  required: true
  verification:

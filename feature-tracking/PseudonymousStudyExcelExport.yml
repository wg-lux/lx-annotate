definition_of_done:
- id: pseudonymous_contract
  category: security
  title: Workbook rows contain pseudonymous case data only
  acceptance:
  - Patient names, dates of birth, raw media, and direct patient identifiers are not exported.
  - Spreadsheet formula prefixes in database-backed text are neutralized.
  required: true
  verification:
    kind: command
    command:
    - uv
    - run
    - --no-sync
    - --with
    - pytest
    - --with
    - pytest-django
    - python
    - -m
    - pytest
    - tests/api/test_study_excel_export.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: uv run --no-sync --with pytest --with pytest-django python -m pytest tests/api/test_study_excel_export.py
        -q (12 passed, 2026-08-28)
    note: Both ad-hoc and reviewed-cohort workbooks remain pseudonymous; cohort IDs are resolved only
      through the existing pseudonymous case scope and metadata cells use formula neutralization.
    assessed_by: codex-export-grouping-20260828
    assessed_at: '2026-08-28T11:12:07.929007Z'
- id: clinical_filters
  category: requirements
  title: Practitioners can filter study rows by annotated clinical concepts
  acceptance:
  - Examinations, findings, and indications can each be selected independently.
  - Values within a category use OR semantics and selected categories use AND semantics.
  - Practitioners can choose one row per center-scoped patient history or one row per matching examination.
  - A matching examination includes all initial and follow-up examinations for the same center-scoped
    patient pseudonym when patient-history grouping is selected.
  - Patients without an examination matching the submitted criteria are not written to the workbook.
  - A reviewed StudyCohortPage preview can be exported as an exact examination-ID snapshot without reinterpreting
    its cohort filters.
  required: true
  verification:
    kind: command
    command:
    - uv
    - run
    - --no-sync
    - --with
    - pytest
    - --with
    - pytest-django
    - python
    - -m
    - pytest
    - tests/api/test_study_excel_export.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: tests/api/test_study_excel_export.py::test_xlsx_exports_the_exact_reviewed_study_cohort_snapshot
        (passed, 2026-08-28)
    - kind: command
      reference: tests/api/test_study_excel_export.py (12 passed, 2026-08-28)
    note: Patient/examination ad-hoc grouping is unchanged; cohort mode exports exactly the server-reviewed
      StudyCohortPage examination IDs and does not expand to unselected follow-ups.
    assessed_by: codex-export-grouping-20260828
    assessed_at: '2026-08-28T11:12:09.535416Z'
- id: excel_download
  category: functionality
  title: Export.vue offers a usable Excel download workflow
  acceptance:
  - The export page loads available clinical concepts from persisted annotated cases.
  - The browser downloads a valid XLSX response and reports empty or invalid selections visibly.
  - Grouped rows expose pseudonymous examination, report, and processed-media references without raw media.
  - The export page exposes the prepared study cohort as a separate mode from ad-hoc case-list and training-data
    exports.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - test:unit
    - --
    - run
    - src/api/__tests__/studyExportApi.test.ts
    - src/components/Export/__tests__/CaseStudyExcelExport.test.ts
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: frontend focused study export AAA suite (16 passed, 2026-08-28)
    - kind: command
      reference: backend study export suite (12 passed, 2026-08-28)
    note: StudyCohortPage captures its normalized reviewed snapshot, routes to a separate Studienkohorte
      export mode, displays the active filters, and downloads through a bounded JSON POST contract.
    assessed_by: codex-export-grouping-20260828
    assessed_at: '2026-08-28T11:12:11.092732Z'
- id: typed_boundary
  category: testing
  title: API and UI boundaries are typed and regression tested
  acceptance:
  - Query parsing rejects missing criteria and unknown values.
  - Frontend request and binary response handling are covered by focused tests.
  - Study cohort names, hypotheses, normalized filters, and patient-examination IDs are validated at their
    frontend and backend boundaries.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - type-check
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command

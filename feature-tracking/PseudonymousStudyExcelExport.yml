definition_of_done:
- id: pseudonymous_contract
  category: security
  title: Workbook rows contain pseudonymous case data only
  acceptance:
  - Patient names, dates of birth, raw media, and direct patient identifiers are not exported.
  - Spreadsheet formula prefixes in database-backed text are neutralized.
  required: true
  verification:
    kind: command
    command:
    - uv
    - run
    - --no-sync
    - --with
    - pytest
    - --with
    - pytest-django
    - python
    - -m
    - pytest
    - tests/api/test_study_excel_export.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: uv run --no-sync --with pytest --with pytest-django python -m pytest tests/api/test_study_excel_export.py
        -q (6 passed)
    note: 'Backend workbook suite: 6 passed; workbook inspection excludes direct identity fields and neutralizes
      formula prefixes.'
    assessed_by: codex-filtered-case-xlsx
    assessed_at: '2026-08-27T14:26:11.787411Z'
- id: clinical_filters
  category: requirements
  title: Practitioners can filter study rows by annotated clinical concepts
  acceptance:
  - Examinations, findings, and indications can each be selected independently.
  - Values within a category use OR semantics and selected categories use AND semantics.
  - Practitioners can choose one row per center-scoped patient history or one row per matching examination.
  - A matching examination includes all initial and follow-up examinations for the same center-scoped
    patient pseudonym when patient-history grouping is selected.
  - Patients without an examination matching the submitted criteria are not written to the workbook.
  required: true
  verification:
    kind: command
    command:
    - uv
    - run
    - --no-sync
    - --with
    - pytest
    - --with
    - pytest-django
    - python
    - -m
    - pytest
    - tests/api/test_study_excel_export.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: tests/api/test_study_excel_export.py (6 passed)
    - kind: command
      reference: tests/api/test_study_excel_export.py (6 passed, grouped follow-up workbook row asserted)
    - kind: command
      reference: tests/api/test_study_excel_export.py (8 passed)
    note: 'Both row groupings verified: patient mode aggregates center-scoped follow-ups after an identity
      matches; examination mode emits only examinations matching all selected category filters.'
    assessed_by: codex-filtered-case-xlsx
    assessed_at: '2026-08-27T14:38:50.685879Z'
- id: excel_download
  category: functionality
  title: Export.vue offers a usable Excel download workflow
  acceptance:
  - The export page loads available clinical concepts from persisted annotated cases.
  - The browser downloads a valid XLSX response and reports empty or invalid selections visibly.
  - Grouped rows expose pseudonymous examination, report, and processed-media references without raw media.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - test:unit
    - --
    - run
    - src/api/__tests__/studyExportApi.test.ts
    - src/components/Export/__tests__/CaseStudyExcelExport.test.ts
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: frontend export tests 7 passed; full vue-tsc build passed
    note: Frontend exposes a radio segmented grouping control and sends the typed group_by parameter;
      workbook metadata records the selected mode.
    assessed_by: codex-filtered-case-xlsx
    assessed_at: '2026-08-27T14:38:52.088276Z'
- id: typed_boundary
  category: testing
  title: API and UI boundaries are typed and regression tested
  acceptance:
  - Query parsing rejects missing criteria and unknown values.
  - Frontend request and binary response handling are covered by focused tests.
  required: true

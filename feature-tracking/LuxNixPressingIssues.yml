- id: key_and_transport_security
  category: security
  title: Vault, encrypted storage, and mutual TLS remain fail closed
  acceptance:
  - The long-lived master key is delivered only through the local secret-file boundary and is never transmitted.
  - Vault-managed secrets are hostname scoped, atomically refreshed, permission restricted, and required
    before service startup.
  - Transfer intake requires TLS, verified client certificates, a configured client certificate authority,
    and authenticated node requests.
  - Shared node secrets are never used for payload encryption.
  required: true
  verification:
    kind: manual
    instructions: Run negative configuration tests and inspect the generated Nginx, systemd, Vault, and
      application environments.
    timeout_seconds: 900
  assessment:
    status: not_assessed
    evidence: []
- id: encrypted_storage_and_recovery
  category: functionality
  title: Storage startup, backup, restore, and recovery preserve cryptographic integrity
  acceptance:
  - Every application service requires the mounted encrypted storage boundary before starting.
  - Backup and restore never publish partial or unverified artifacts.
  - Missing keys, wrong devices, unavailable mounts, hash mismatches, and inconsistent state fail loudly
    and preserve logs.
  - Recovery marks irrecoverable artifacts LOST and never substitutes unsafe plaintext or an unrelated
    key.
  required: true
  verification:
    kind: manual
    instructions: Perform negative mount, key, interrupted-backup, restore, and reconciliation exercises
      on a disposable production-like host.
    timeout_seconds: 1800
  assessment:
    status: not_assessed
    evidence: []
- id: service_and_queue_observability
  category: operations
  title: Operators can identify the actual worker and state for every UI-triggered job
  acceptance:
  - Monitoring follows Celery queue routing rather than task registration output.
  - Inference, frame extraction, HLS, maintenance, and default queues have explicit worker ownership and
    health checks.
  - Logs correlate application request, task identifier, resource, queue, worker unit, retry, and terminal
    state.
  - Runbooks distinguish automatic termination, manual restart, explicit kill, and host shutdown.
  required: true
  verification:
    kind: manual
    instructions: Trace successful and failed prediction, post-validation rebuild, and HLS jobs using
      only production telemetry.
    timeout_seconds: 1200
  assessment:
    status: not_assessed
    evidence: []

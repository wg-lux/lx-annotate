- id: rewritten_dependency_environment_upgrade
  category: operations
  title: Rewritten endoreg-db and lx-dtypes can be installed without identity or runtime-root drift
  acceptance:
  - The LuxNix secrets-management.yml catalog owns cross-repository rotation order. The host environment
    declares all three application keyring handles; signing manifests use the endoreg-db validator and
    export only the active key to SECRET_KEY with empty SECRET_KEY_FALLBACKS. Tests reject unsafe manifests
    and prove retired signatures are rejected without production credentials.
  - Service wrappers, maintenance commands, and both systemd environment files export the same absolute
    LX_RUNTIME_ROOT derived from runtime.encryptedDataDir.
  - DJANGO_SALT_FILE references a provisioned private regular file readable by the service user. Existing
    identity hashes remain compatible; default-salt deployments require a reviewed migration, never an
    automatically generated replacement salt or a bypass of production validation.
  - Recovery commands exist in the installed dependency release and do not fall back to raw file copying
    when a removed migration command fails.
  - Production settings, worker imports, queue recovery, canonical migration graph, and installed artifact
    acceptance pass for the reviewed dependency set before host activation.
  required: true
  verification:
    kind: manual
    instructions: Run the system tests and LuxNix rewrite environment contract, then verify salt provenance,

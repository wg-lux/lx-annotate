  title: LuxNix consumes the verified LX-Annotate 0.9.53 wheel safely
  acceptance:
  - The LuxNix wheel URL and SHA-256 pin are updated only after 0.9.53 is published to PyPI, and the inferred
    package version evaluates to exactly 0.9.53.
  - The pinned PyPI digest matches the release evidence recorded for the tested LX-Annotate wheel; LuxNix
    does not rebuild or substitute an unreviewed source checkout for production wheel mode.
  - Nix package evaluation and the LX-Annotate NixOS virtual-machine test pass with the pinned wheel and
    the production systemd environment, including the governed terminology registry and host adapter settings.
  - Installed-service smoke checks cover Django readiness, the canonical /dtypes-api/ routes, reporting-language
    discovery, report-template retrieval, persisted-ledger validation, and report draft save and reload.
  - Upgrade ordering, migration compatibility, and a rollback to the previously pinned 0.9.52 wheel are
    demonstrated on a disposable production-like host before the production option is promoted.
  - The LuxNix commit that changes the wheel pin records the PyPI artifact identity and links to the completed
    LX-Annotate 0.9.53 release evidence.
  required: true
  verification:
    kind: manual
    instructions: After PyPI publication, update the immutable wheel pin, run package evaluation and the

- id: eager_runtime_directory_contract
  category: functionality
  title: Clean boot creates every required protected intake directory
  acceptance:
  - systemd tmpfiles eagerly creates video_import, report_import, preanonymized_import, sap_import, sap_import_processed,
    and sap_import_failed beneath the protected runtime root.
  - Ownership and modes support only the intended watcher, SAP, and file-mover principals.
  - Runtime helpers do not lazily create infrastructure directories as a prerequisite for successful ingest.
  required: true
  verification:
    kind: manual
    instructions: Evaluate tmpfiles rules and perform a clean-boot ingest test on an empty protected volume.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:

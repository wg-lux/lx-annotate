prevention_change:
  tracked_in: feature-tracking/StorageOptimization.yml#hls_packaged_runtime_failure_injection
  source_repository: /home/admin/dev/lx-annotate
  source_base_revision: 0b450b3479a6cba32693597207e51d5c0d6012d9
  source_state: Existing staged changes preserved; prevention changes remain unstaged.
  application_version: 1.2.3
  dependency_requirement: asgiref>=3.12.1,<4
  locked_dependency_version: 3.12.1
  dependency_wheel_sha256: fe386d1c2bff7259ea95929266d12a8cf9a8b5a1c2598402967d8792e7a7c094
  uv_lock_sha256: bb26627a9c5e6c0d435ae354345ccde94b1e824ea21f1e8c289faf0862a54a54
  flake_lock_sha256: 3f755aa25b0b9aacdfb3f261a41ad94ae97e95df892541e53dc1619c4aea345d
  upstream:
    - https://github.com/django/asgiref/blob/3.12.1/CHANGELOG.txt
    - https://github.com/django/asgiref/pull/563
  mechanism: >-
    Older ThreadSensitiveContext cleanup synchronously joins the executor thread on the ASGI event
    loop. A disconnected request whose synchronous work remains active can therefore freeze every
    request. Version 3.12.1 includes the upstream fix that joins off the event loop without occupying
    the default executor. This reproduces the observed class of hang; the original production Python
    stack was not captured, so attribution of that individual incident remains inferential.
  regression:
    file: tests/system/test_asgi_request_cancellation.py
    isolation: Real application ASGI entrypoint with test-only Django routes and no clinical models, database, media, or credentials.
    old_dependency_result: asgiref 3.11.1 deadlocked after server cancellation; parent killed child at 12 seconds.
    old_dependency_stack: Django ASGIHandler.__call__ -> ThreadSensitiveContext.__aexit__ -> ThreadPoolExecutor.shutdown -> Thread.join
    fixed_dependency_result: Four scenarios passed in 2.23 seconds with asgiref 3.12.1.
    cases:
      - One disconnected synchronous request
      - Four concurrent disconnected synchronous requests
      - One disconnected request with the default executor occupied
      - Four disconnected requests with the default executor occupied
    assertions:
      - Unrelated HTTP requests complete before blocked synchronous work is released.
      - Cancelled requests and their synchronous work drain after release.
      - Subsequent HTTP requests succeed.
  verification:
    - command: /home/admin/endoreg-db/.devenv/state/venv/bin/pyright tests/system/test_asgi_request_cancellation.py
      result: 0 errors, 0 warnings
    - command: .devenv/state/venv/bin/ruff check tests/system/test_asgi_request_cancellation.py
      result: passed
    - command: .devenv/state/venv/bin/ruff format --check tests/system/test_asgi_request_cancellation.py
      result: passed
    - command: uv lock --check
      result: passed; only asgiref changed version in the lockfile
    - command: .devenv/state/venv/bin/pytest -q tests/system/test_asgi_request_cancellation.py
      result: 4 passed
    - command: .devenv/state/venv/bin/pytest -q tests/system/test_oidc_settings.py tests/system/test_production_celery_routing.py tests/api/test_video_lifecycle_readiness.py
      result: 16 passed, 26 failed due to the unavailable can_dismiss_upload_job import in the existing pinned Endoreg wheel.
    - command: PYTHONPATH=/home/admin/.cache/lx-annotate/asgi-regression-3.11.1:. .devenv/state/venv/bin/pytest -q --maxfail=1 --tb=line tests/api/test_video_lifecycle_readiness.py::test_mounted_import_dismissal_hides_only_the_row_and_preserves_source
      result: The same ImportError also occurs with asgiref 3.11.1; this is independent of the upgrade.
  rollout:
    performed: false
    reasons:
      - Existing staged overview code requires can_dismiss_upload_job, absent from the locked endoreg-db 1.2.0 wheel.
      - tracker.py check deployment_source_hygiene exited 1 with 0/6 required criteria verified.
    gc10_dependency: Still asgiref 3.11.1; production dependency files were not changed during this prevention work.
    final_host_check: Web and FFmpeg units active; trusted HTTPS returned 302 in 0.004772 seconds.
    required_followup: Resolve the Endoreg release contract, package the tested ASGI requirement into the reviewed release, and perform the governed gc-10 rollout and authenticated playback acceptance.

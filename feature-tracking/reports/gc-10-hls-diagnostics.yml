  locked_dependency_version: 3.12.1
  dependency_wheel_sha256: fe386d1c2bff7259ea95929266d12a8cf9a8b5a1c2598402967d8792e7a7c094
  uv_lock_sha256: bb26627a9c5e6c0d435ae354345ccde94b1e824ea21f1e8c289faf0862a54a54
  flake_lock_sha256: 3f755aa25b0b9aacdfb3f261a41ad94ae97e95df892541e53dc1619c4aea345d
  upstream:
    - https://github.com/django/asgiref/blob/3.12.1/CHANGELOG.txt
    - https://github.com/django/asgiref/pull/563
  mechanism: >-
    Older ThreadSensitiveContext cleanup synchronously joins the executor thread on the ASGI event
    loop. A disconnected request whose synchronous work remains active can therefore freeze every
    request. Version 3.12.1 includes the upstream fix that joins off the event loop without occupying
    the default executor. This reproduces the observed class of hang; the original production Python
    stack was not captured, so attribution of that individual incident remains inferential.
  regression:
    file: tests/system/test_asgi_request_cancellation.py
    isolation: Real application ASGI entrypoint with test-only Django routes and no clinical models, database, media, or credentials.
    old_dependency_result: asgiref 3.11.1 deadlocked after server cancellation; parent killed child at 12 seconds.
    old_dependency_stack: Django ASGIHandler.__call__ -> ThreadSensitiveContext.__aexit__ -> ThreadPoolExecutor.shutdown -> Thread.join
    fixed_dependency_result: Four scenarios passed in 2.23 seconds with asgiref 3.12.1.
    cases:
      - One disconnected synchronous request
      - Four concurrent disconnected synchronous requests
      - One disconnected request with the default executor occupied
      - Four disconnected requests with the default executor occupied
    assertions:
      - Unrelated HTTP requests complete before blocked synchronous work is released.
      - Cancelled requests and their synchronous work drain after release.
      - Subsequent HTTP requests succeed.
  verification:

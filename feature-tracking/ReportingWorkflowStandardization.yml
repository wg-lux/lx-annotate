    assessed_at: '2026-08-13T11:48:01.207388Z'
- id: workflow_regression_suite
  category: testing
  title: Reporting workflows have layered regression coverage
  acceptance:
  - Unit tests cover normalization and graph resolution helpers.
  - Component tests cover shell context propagation and colonoscopy indication/template access.
  - Application and component-test type checks pass.
  required: true
  verification:
    kind: manual
    instructions: Run focused reporting tests followed by both frontend type-check lanes.
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'cd frontend && npm run test:unit -- --run: 93 files, 608 tests passed'
    - kind: command
      reference: cd frontend && npm run type-check
    - kind: command
      reference: cd frontend && npm run type-check:component-tests
    note: Complete frontend unit suite passes 93 files and 608 tests; focused reporting tests cover colonoscopy
      examination, indication-choice, and template propagation; both vue-tsc lanes pass.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:29:30.428439Z'
- id: observable_workflow_failures
  category: operations
  title: Reporting resolution failures are observable
  acceptance:
  - Users receive actionable errors when selected examinations cannot resolve in the active catalog.
  - Async context changes do not apply stale examination, indication, or template results.
  required: true
  verification:
    kind: manual
    instructions: Review error presentation and race guards, then run context-switch regression tests.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: frontend/src/views/reporting/__tests__/CaseSetupPage.test.ts
    - kind: test
      reference: frontend/src/views/reporting/__tests__/CaseResolutionPage.test.ts
    - kind: test
      reference: frontend/src/views/reporting/__tests__/ReportEditorPage.test.ts
    note: Missing, ambiguous, and contradictory examination contexts surface actionable UI errors; shell/editor
      generation guards and template request generations reject stale async results.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:27:18.180747Z'
- id: maintained_contract_documentation
  category: documentation
  title: Reporting ownership and lookup contracts remain maintainable
  acceptance:
  - Canonical contract sources and frontend ownership boundaries are documented in English.
  - New workflow invariants are represented in the YAML tracker and linked tests.
  required: true
  verification:
    kind: manual
    instructions: Review project documentation and tracker evidence after each workflow increment.
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: document
      reference: docs/guides/reporting-template-requirements-page.md
    - kind: code
      reference: frontend/src/views/reporting/reportingExaminationResolution.ts and reportingIndicationContract.ts
    note: Canonical English guide documents shell ownership, shared examination resolution, fail-closed
      graph states, and the separate persisted-selection versus option-normalization indication contracts.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:28:14.114669Z'
- id: canonical_localized_terms
  category: requirements
  title: Reporting labels use canonical lx-data-model terms
  acceptance:
  - Stable concept names remain graph identifiers and are never translated through frontend-specific clinical
    mappings.
  - German and English labels resolve from canonical name_de and name_en fields at typed API boundaries.
  - Missing localized terms fall back to the stable canonical name without guessed translations.
  required: true
  verification:
    kind: manual
    instructions: Run focused core-concept, case API, reporting shell, and report editor tests.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: frontend/src/types/coreConcepts.ts, frontend/src/api/casesApi.ts, and frontend/src/api/reportTemplatesApi.ts
    - kind: test
      reference: 16 focused API/reporting files and 116 tests passed
    - kind: command
      reference: cd frontend && npm run type-check && npm run type-check:component-tests
    note: Canonical name/nameDe/nameEn typing is preserved through case and report-template API boundaries;
      report language selection uses lx-data-model translations without template-specific frontend mappings.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:45:57.500837Z'
- id: reporting_progressive_disclosure
  category: functionality
  title: Reporting prioritizes recognition and first actions
  acceptance:
  - Case and examination choices use clinical labels and dates without exposing numerical IDs as primary
    text.
  - The first viewport retains workflow selections and a short start guide while supporting information
    is collapsed but accessible.
  - Case, examination, template, and terminology lists remain filtered by the active workflow context.
  required: true
  verification:
    kind: manual
    instructions: Run reporting shell component tests and inspect the command bar at desktop and narrow
      viewport widths.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: frontend/src/views/reporting/ReportingShell.vue and ReportEditorPage.vue
    - kind: test
      reference: frontend/src/views/reporting/__tests__/ReportingShell.mediaPreload.test.ts
    - kind: document
      reference: docs/guides/reporting-template-requirements-page.md
    note: Primary choices and summary omit technical identifiers; first actions remain visible and technical
      context is available in closed native details elements. Existing patient/case/examination/template
      filters are unchanged.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:41:40.450080Z'

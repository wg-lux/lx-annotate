- id: reporting_progressive_disclosure
  category: functionality
  title: Reporting prioritizes recognition and first actions
  acceptance:
  - Reporting resolves the selected case patient and loads that patient's complete report and video history
    without restricting media to the current examination, including a newly created empty examination.
  - Report text is readable without a PDF. File actions use only backend-provided stream options; report
    identifiers must never be interpreted as PDF identifiers.
  - Clinicians can select earlier reports and videos without changing clinical ownership. Context changes,
    failed refreshes and late responses cannot retain another patient's media.
  - Case and examination choices use clinical labels and dates without exposing numerical IDs as primary
    text.
  - The first viewport retains workflow selections and a short start guide while supporting information
    is collapsed but accessible.
  - Case, examination, template, and terminology lists remain filtered by the active workflow context.
  required: true
  verification:
    kind: manual
    instructions: Run reporting shell component tests and inspect the command bar at desktop and narrow
      viewport widths.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:

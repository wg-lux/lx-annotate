- path: docs/guides/reporting-template-requirements-page.md
  disposition: reference
  note: 'Reporting template and lookup workflow contract. 2026-09-28 centralization by codex-terminology-20260928-a:
    FindingsCapturePage delegates inline template selection through the typed reportTemplateSelectionContext
    to ReportingShell''s existing selection workflow. Both selectors now share confirmation, draft save,
    published-template resolution, context checks, draft rebuild and rollback. Section drafts, generated
    report text and validation reset only after successful preparation; dirty draft changes also trigger
    the shared confirmation/save gate. Removed the duplicate inline reset and duplicate selector markup.
    Focused FindingsCapturePage and ReportingShell tests cover delegation and successful or depublished-template
    switches through both entry points: 55 passed. Application vue-tsc --noEmit -p tsconfig.app.json and
    scoped ESLint with --max-warnings 0 passed.'

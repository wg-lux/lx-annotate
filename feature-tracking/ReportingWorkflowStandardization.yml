        normalization)
    - kind: command
      reference: npm run type-check and scoped ESLint (passed after caused_by_interventions addition)
    - kind: document
      reference: /home/admin/lx-data-models/docs/data-model-concept-map.yml
    - kind: test
      reference: frontend/src/api/__tests__/reportTemplateKnowledgeBaseIdentity.test.ts preserves report_template_examples@0.1.0
        and canonical German template title
    - kind: command
      reference: npm run type-check; npm run type-check:component-tests; 4 focused reporting suites 62
        passed; scoped ESLint passed
    - kind: test
      reference: /home/admin/lx-data-models report-template API emits knowledge_base_module, knowledge_base_version,

schema_version: '1.0'
id: reporting_workflow_standardization
name: Reporting Workflow Standardization
description: Standardize reporting context propagation, typed API boundaries, graph resolution, and workflow
  behavior through durable regression coverage.
owners:
- lx-annotate frontend maintainers
- lx-dtypes maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/guides/reporting-template-requirements-page.md
  disposition: reference
  note: Reporting template and lookup workflow contract.
definition_of_done:
- id: coherent_context_typing
  category: requirements
  title: Reporting context has one coherent typed representation
  acceptance:
  - Patient examination identity, examination concept name, and numeric examination ID are propagated
    without divergent local guesses.
  - Runtime boundary assertions reject malformed or contradictory reporting context.
  required: true
  verification:
    kind: manual
    instructions: Review the reporting shell, builder, editor, and store contracts and run their focused
      tests.
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: frontend/src/views/reporting/reportingExaminationResolution.ts
    - kind: test
      reference: frontend/src/views/reporting/__tests__/reportingExaminationResolution.test.ts
    note: One shared typed examination resolver now governs builder, findings, editor, case setup, and
      case-resolution handoffs; ID/name contradictions and ambiguous names fail explicitly.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:27:12.211124Z'
- id: deterministic_graph_resolution
  category: functionality
  title: Clinical concept graph resolution is deterministic
  acceptance:
  - Examination names resolve to the correct concept IDs within the active terminology bundle.
  - Indications, findings, and report templates are loaded from the resolved examination context.
  - Missing and ambiguous graph nodes fail visibly instead of selecting unrelated defaults.
  required: true
  verification:
    kind: manual
    instructions: Exercise colonoscopy and upper-GI reporting contexts against representative API payloads.
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'frontend reporting graph and workflow suite: 75 passed'
    - kind: code
      reference: frontend/src/views/reporting/reportingIndicationContract.ts
    note: Colonoscopy canonical-name resolution reaches findings, indication choices, and report templates;
      preferred-examination handoffs and duplicate nodes use the same fail-closed resolver.
    assessed_by: codex-reporting-types-20260813
    assessed_at: '2026-08-13T08:27:13.977762Z'
- id: typed_boundary_safety
  category: security
  title: Reporting API boundaries are validated and fail closed
  acceptance:
  - Unknown API payloads are normalized before use and are not accepted through unchecked assertions.
  - Missing clinical identifiers do not silently broaden queries or load unrelated concepts.
  required: true
  verification:
    kind: manual
    instructions: Review changed API boundaries and negative-path tests for malformed, missing, and ambiguous
      values.
    timeout_seconds: 900
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: frontend/src/views/reporting/__tests__/reportingIndicationContract.test.ts
    - kind: test
      reference: frontend/src/views/reporting/__tests__/ReportTemplateBuilderPage.test.ts
    - kind: code
      reference: frontend/src/api/casesApi.ts; frontend/src/views/reporting/CaseSetupPage.vue
    - kind: test
      reference: frontend/src/api/__tests__/casesApi.test.ts; frontend/src/views/reporting/__tests__/CaseSetupPage.test.ts
    - kind: command
      reference: npm run test:unit -- --run src/api/__tests__/casesApi.test.ts src/views/reporting/__tests__/CaseSetupPage.test.ts
        (11 passed)
    - kind: command
      reference: npm run type-check:component-tests and scoped ESLint (passed)
    - kind: test
      reference: frontend/src/api/__tests__/coreConcepts.test.ts (2 passed against additive classification/examination
        type arrays)
    - kind: review
      reference: 'lx-data-models CoreConceptCollection tightening: 237 Python tests and Pyright passed;
        frontend compatibility reviewed'
    - kind: code
      reference: frontend/src/types/coreConcepts.ts; frontend/src/api/coreConcepts.ts
    - kind: test

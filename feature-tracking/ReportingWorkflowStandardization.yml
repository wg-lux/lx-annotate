    without divergent local guesses.
  - Runtime boundary assertions reject malformed or contradictory reporting context.
  - Reporting examination creation sends the selected knowledge-base module and version;
    the atomic host creation route validates and persists both before catalog reads.
  required: true
  verification:
    kind: manual
    instructions: Review the reporting shell, builder, editor, and store contracts and run their focused
      tests.
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: frontend/src/views/reporting/reportingExaminationResolution.ts
    - kind: test
      reference: frontend/src/views/reporting/__tests__/reportingExaminationResolution.test.ts
    - kind: test
      reference: '2026-10-09 codex-api-dtypes-20261009: casesApi, CaseSetupPage, ReportEditorPage,
        ReportingShell.mediaPreload — 130 tests passed; endoreg-db tests/views/case/test_case_viewset.py
        — 24 passed, including persisted coloreg@0.3.0 and rejected partial/unavailable identities.'
    note: One shared typed examination resolver now governs builder, findings, editor, case setup, and
      case-resolution handoffs; ID/name contradictions and ambiguous names fail explicitly.
      Reporting creation now carries the selected module/version through the host serializer;
      indication catalog reads carry the same context as findings. Existing unpinned examinations
      are not automatically migrated. This is local verification, not deployment acceptance.

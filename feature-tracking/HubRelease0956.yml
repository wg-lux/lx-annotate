- id: live_hub_acceptance
  category: operations
  title: Live site-to-hub transfer and recovery acceptance pass
  acceptance:
  - Site and hub web services, the dedicated Hub transfer worker, database, Redis, Vault gates, certificate
    renewal, and reverse proxy are active with no unresolved restart loop or capacity failure.
  - A representative anonymized processed artifact completes register, media upload, receiver apply, sender
    reconciliation, local cleanup policy, and audit correlation over the production-like mTLS path.
  - Negative acceptance proves raw media, invalid certificate, wrong node secret, wrong center, hash mismatch,
    duplicate collision, and unavailable Vault or receiver states fail closed without data leakage.
  - Restart, retry, stale-job recovery, certificate rotation, and rollback to the prior application generation
    preserve ledger integrity and do not replay an applied transfer.
  required: true
  verification:
    kind: manual
    instructions: Run the installed live acceptance workflow on the designated production-like site and
      hub nodes, retain structured logs and identifiers, then exercise failure, recovery, rotation, and
      rollback.
    timeout_seconds: 3600
  assessment:
    status: not_assessed
    evidence: []

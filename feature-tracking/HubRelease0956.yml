- id: fail_closed_security_boundary
  category: security
  title: Hub transfer remains fail closed across hostile internal networks
  acceptance:
  - Transfer activation requires HTTPS, a trusted client CA, successful proxy mTLS verification, and authenticated
    NetworkNode request identity; shared-secret-only fallback is rejected.
  - Only explicitly selected anonymized processed media is exportable; raw media and unvalidated media
    are rejected before network transmission.
  - The long-lived application master key is never transmitted, logged, embedded in release artifacts,
    or reused for request or payload authentication.
  - Missing Vault, AppRole, CA, client certificate, private key, encrypted storage, or receiver trust
    state prevents transfer and preserves actionable logs.
  required: true
  verification:
    kind: manual
    instructions: Run positive and negative Hub security tests, inspect generated Nginx and systemd configuration,
      and exercise missing or invalid Vault, mTLS, node-secret, and media-state cases.
    timeout_seconds: 1800
  assessment:
    status: not_assessed
    evidence: []
- id: envelope_encrypted_media_transfer
  category: security
  title: Standalone processed media uses a replay-safe recipient envelope
  acceptance:
  - Every media upload uses a fresh per-transfer 256-bit Data Encryption Key and authenticated encryption;
    the key is wrapped exclusively for the configured central-hub recipient key and never derived from
    NetworkNode.shared_secret or an application master key.
  - Authenticated envelope metadata binds transfer key, source node, target node, resource kind, expected
    plaintext digest, plaintext size, recipient key identifier, and encryption profile so metadata substitution,
    cross-transfer replay, truncation, and ciphertext modification fail closed.
  - Sender retries reuse one atomically persisted mode-0600 ciphertext envelope for the same immutable
    transfer; plaintext media is never materialized outside the approved protected storage boundary or
    transmitted on the wire.
  - Processed-media ciphertext uses a fixed-length application/octet-stream request body with bounded
    sender chunks. Envelope metadata and media role use size-bounded headers; neither sender nor receiver
    constructs a multipart body for the media artifact.
  - The receiver requires envelope metadata and its private unwrap key, rejects plaintext and malformed,
    tampered, wrong-recipient, or replay-inconsistent uploads before model-file publication, validates
    the decrypted digest and size, and persists through its own encrypted storage using its local master
    key.
  - Granular tests cover success, exact retry, changed-source replay, missing keys and metadata, wrong
    key, authenticated-metadata tampering, ciphertext tampering, truncation, multipart rejection, bounded
    raw-body streaming, atomic cleanup, and absence of source or receiver master keys from payloads, logs,
    configuration, and transfer records.
  required: true
  verification:
    kind: manual
    instructions: Run focused sender and receiver envelope unit suites, cross-repository endpoint tests,
      static typing, and a production-like mTLS transfer using distinct site and hub storage master keys.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'lx-data-models Hub envelope contracts: Pyright 0 errors; pytest 46 passed'
    - kind: command
      reference: endoreg-db locked-scope Pyright 0 errors; service/contract/provenance pytest 60 passed
        plus 5 subtests; endpoint/envelope/provenance pytest 55 passed plus 5 subtests
    - kind: command
      reference: lx-annotate Ruff passed; Pyright 0 errors; sender atomic/worker/cross-repository E2E
        pytest 25 passed
    - kind: command
      reference: LuxNix Hub eval 5 passed; rotation/CSV eval 2 passed; isolated Vault envelope nixtest
        1 passed; Nix parse/nixfmt/YAML/diff checks passed
    note: Phase 2 locally implemented across lx_dtypes, lx-annotate, endoreg-db, and LuxNix. Atomic sender/receiver
      tests and encrypted cross-repository E2E are green; production verification remains pending a clean
      coordinated lx-dtypes/endoreg package build plus deployed gs-02 current-and-retiring key rotation

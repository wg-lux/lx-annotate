- id: sender_receiver_contract
  category: functionality
  title: Sender and receiver complete one idempotent anonymized transfer
  acceptance:
  - The site sender registers a deterministic transfer at POST /api/media/hub/transfers/, uploads media
    at the transfer-key media route, and reconciles through the transfer-key status route.
  - The receiver authenticates the node, validates center and transfer identity, persists normalized provenance,
    applies the upload exactly once, and returns the documented awaiting_media, applied, failed, or inconsistent
    states.
  - Retries, timeouts, duplicate requests, hash mismatches, payload collisions, stale jobs, and remote
    terminal states are deterministic and leave an auditable ledger.
  - Installed-wheel tests exercise the real URL configuration, middleware, receiver services, database
    models, and sender client rather than only mocked helper functions.
  - Granular sender tests prove that an imported video can reach transfer eligibility through explicit
    anonymization validation, final segment cleanup, authenticated ready-for-export promotion, operator
    marking, and queueing, while every incomplete intermediate state remains fail closed.
  required: true
  verification:
    kind: manual
    instructions: Run focused sender, receiver, URL, middleware, transfer-service, model, and installed-wheel

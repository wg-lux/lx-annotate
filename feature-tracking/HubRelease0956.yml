  category: operations
  title: LuxNix activates the pinned 0.9.56 Hub runtime on site and hub nodes
  acceptance:
  - LuxNix pins the published 0.9.56 wheel URL and digest and the matching LX-Annotate Flake commit from
    one reviewed source tree without unrelated fleet changes.
  - The gs-02 Vault service is deployed, initialized and unsealed under the approved operator process;

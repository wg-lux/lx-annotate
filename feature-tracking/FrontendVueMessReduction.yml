definition_of_done:
- id: measured_reduction
  category: testing
  title: Default detector findings are substantially reduced and frontend behavior is verified
  acceptance:
  - Run npm --prefix frontend run vue-mess-detector before and after changes.
  - Preserve detector rules and exclusions and existing workflow behavior.
  - Record exact count reduction and frontend verification results.
  required: true
  verification:
    kind: manual
    instructions: Compare each recorded pass baseline with its final output, then run frontend checks
      and verify formatting on the changed files.
    timeout_seconds: 1200
  assessment:
    status: verified
    evidence:
    - kind: command

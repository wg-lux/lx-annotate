      reference: cd frontend && npx vue-tsc --build --force
    - kind: command
      reference: cd frontend && npm run type-check:component-tests
    - kind: command
      reference: cd frontend && npm run lint
    - kind: command
      reference: cd frontend && npm run build-only
    - kind: command
      reference: cd frontend && npx prettier --write --single-attribute-per-line src/api/__tests__/reportingTimelineApi.test.ts

- id: api_first_overview_operations
  category: functionality
  title: Overview capacity and media operations reflect authoritative API state
  acceptance:
  - The overview displays an authenticated filesystem-capacity observation with total, used,
    available and system-reserved bytes, explicit filesystem scope and observation time.
    Table filtering and partial raw-file byte sums never masquerade as general storage usage.
  - Permission denial and unavailable capacity remain explicit; failed refresh removes stale
    capacity. Storage reads are bounded and disclose neither protected paths nor media contents.
  - Active import and HLS stages have accessible indeterminate progress unless the backend
    supplies measured progress with a meaningful denominator. Terminal states stop progress.
  - Overview requests coalesce, discover newly active work, recover after request failures,
    and cannot restart polling after the component is disposed.
  - Import interruption is a persisted, center-authorized cancellation request by upload-job UUID.
    The UI distinguishes requested cancellation from acknowledged cancellation. Cooperative worker
    checkpoints, completion races and redelivery preserve encrypted sources and valid published media.
  - Transcode artifact semantics are explicitly chosen before enabling a web action. Durable
    jobs serialize incompatible media operations, preserve temporal annotation integrity, and
    expose real stages and measured terminal byte savings without guaranteeing a target size.
  - Operators can shrink the processed derivative, individually or in bounded, idempotent batches
    from video state repair. HLS provides playback; no additional full-video playback copy can be
    submitted. Raw media and annotation timing are preserved.
  - The current job model and migrated field choices expose only replacement transcoding.
    The backend model has no optimized-playback fields. The undeployed copy schema and its
    compatibility code are removed directly, without adding a retirement migration.
  - Replacement cleanup is durably recorded and retried before another generation is encoded.
    Failed cleanup never claims reclaimed bytes or permits repeated attempts to accumulate artifacts.
    Previous canonical generations retire only after the replacement and HLS are verified.
  - State repair preserves failed upload diagnostics and never treats historical HLS or file
    existence as proof of a successful replacement import or permission to delete a source.
  - Transcode decryption failures fail closed, plaintext scope remains restrictive, and a
    post-publication cleanup failure never deletes the currently referenced published artifact.
  required: true
  verification:
    kind: manual
    instructions: Run mounted capacity API and overview client/component tests, cancellation
      worker/authorization/race tests, and encrypted transcode publication/concurrency tests.
      Review the dependency versions and perform browser acceptance only after the safe
      transcode contract and artifact semantics are settled.
    timeout_seconds: 1800

- id: browser_lifecycle_acceptance
  category: operations
  title: A deployed browser completes the entire lifecycle and recovery scenarios
  acceptance:
  - A fresh authorized login completes import, recovery, anonymization review, segment save/reload and
    hub export on a named host while background work is active, with attributable release evidence.
  - Wrong-center access, missing media, HLS preparation, expired sessions and navigation during requests
    produce correct safe behavior without losing review state or misrepresenting completion.
  required: true
  verification:
    kind: manual
    instructions: Perform reviewed browser acceptance on gc-05 or gc-10 after deployment/storage/worker
      blockers are resolved. Record host, release, outcomes and timings without clinical payloads.
    timeout_seconds: 3600
  assessment:
    status: not_assessed
    evidence: []

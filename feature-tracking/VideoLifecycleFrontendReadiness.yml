- id: scoped_lifecycle_actions
  category: security
  title: Recovery and hub export enforce operator and center authorization
  acceptance:
  - Repair, export overview, marking, bulk offload, retry and unmark enforce resource center scope.
  - Mutations enforce their governed operator capability independently of frontend visibility.
  required: true
  verification:
    kind: manual
    instructions: Verify denial for centerless and unrelated-center users and unauthorized roles through
      the mounted APIs, including bulk actions, with authorized positive controls.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: lx_annotate/permissions.py; lx_annotate/views/video_state_repair.py; lx_annotate/views/hub_export.py;
        lx_annotate/hub/hub_export_jobs.py; lx_annotate/views/anonymization_overview.py
    - kind: test
      reference: tests/api/test_video_lifecycle_readiness.py; tests/hub/test_hub_export_api.py
    note: Mounted mutations enforce the existing backend route-role policy without DEBUG bypass and use
      the canonical center resolver. Overview and bulk discovery are scoped; mark/unmark reject mixed-center
      resources atomically; retry checks resource and stored source center. Local roleless/centerless/wrong-center
      denials and authorized controls pass. Existing privileged scope semantics are retained. Live authorization
      acceptance remains pending.
    assessed_by: codex-video-readiness-20260907
    assessed_at: '2026-09-07T11:36:39.022552Z'
- id: anonymization_review_continuity
  category: functionality
  title: Anonymization review waits for media and preserves the approved target
  acceptance:
  - HLS HTTP202 with Retry-After displays preparation and retries with bounded cancellation-aware waiting.
  - Approval completion and navigation remain bound to the item submitted when the selection changes.
  required: true
  verification:
    kind: manual
    instructions: Open a video requiring HLS materialization; then approve one item while attempting Skip
      or Reject before its request resolves. Verify target identity and completion feedback.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: frontend/src/composables/useAuthenticatedVideoStream.ts; frontend/src/components/Anonymizer/AnonymizationValidationComponent.vue
    - kind: test
      reference: frontend/src/composables/__tests__/useAuthenticatedVideoStream.test.ts (14 passed); frontend/src/components/Anonymizer/__tests__/AnonymizationValidationComponent.test.ts
        (10 passed)
    note: HTTP 202 enters visible preparation, honors Retry-After and bounds waiting to two minutes with
      cancellation on target change or unmount. Skip/Reject are disabled and guarded during approval;
      navigation receives captured file, examination and item identity and ignores stale/unmounted completion.
      Local preparation, cancellation, timeout and approval-control regressions pass. Deployed HLS and
      browser navigation acceptance remains pending.
    assessed_by: codex-video-readiness-20260907
    assessed_at: '2026-09-07T11:36:41.462439Z'
- id: segment_annotation_continuity
  category: functionality
  title: Segment operations preserve target and pending-operation boundaries
  acceptance:
  - KI rerun polling and completion remain bound to the video and history ID originally submitted.
  - Segment mutation controls honor outstanding validation and incompatible processing operations.
  - Anonymization approval and segment validation remain independent workflow gates.
  - A newly queued annotation expansion must not be reported as failed because a previous rebuild history
    failed.
  required: true
  verification:
    kind: manual
    instructions: Switch videos during delayed KI submission/model refresh and attempt editing during
      validation cleanup. Verify read-only validated tracks and reversible annotator overrides.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: frontend/src/components/VideoExamination/VideoExaminationAnnotation.vue
    - kind: test
      reference: frontend/src/components/VideoExamination/__tests__/VideoExaminationAnnotation.dropdown.test.ts
        (15 passed)
    note: KI submission and history polling capture the original video and selection generation; stale
      completion cannot update another selection. Segment mutations are blocked during outstanding validation
      and KI work, while validation waiting feedback remains visible. Regressions cover delayed submission
      after selection change, pending-validation controls, independent anonymization gates and reversible
      annotator overrides. Deployed browser acceptance remains pending. Diagnostic follow-up on 2026-09-08
      by codex-video-validation-20260908 on gc-02 (site-client). Read-only journal inspection confirms
      bulk validation saved 83 segments for video 5 at 08:20:57 Europe/Berlin. Annotation expansion completed
      at 08:21:14 and dispatched rebuild task 8d6a0cb4-16e4-4073-8e4b-8bec051ac638. Through 08:25:14 the
      task retried with MediaOperationDeferred because stream leases were active; the latest reported
      lease expired at 08:27:56. The actual consuming unit was lx-annotate-celery-ffmpeg-worker.service.
      Source finding — The installed segments_crud.py bulk response reports annotation_expansion_queued
      while resolve_segment_annotation_status still prioritizes the latest rebuild history. The frontend
      submitVideoSegments ignores annotation_expansion_queued, treats cleanup_failed as terminal, and
      uses the generic Bulk validation completed message as its failure detail. An old failed rebuild
      can therefore be displayed as failure of a newly accepted validation request. Verification — hostname
      and inventory confirm gc-02 (172.16.255.102), configured as a site client in wheel mode. systemctl
      show reports web and frame-extraction services active/running. journalctl --namespace=lx-annotate
      --since today and JSON unit metadata establish the task sequence. No media contents, secret values,
      database writes, service restarts or deployment changes. Limitations — The cause of the earlier
      rebuild returning false and eventual completion of the new rebuild are not established. Source corrections
      and regression tests remain outstanding.
    assessed_by: codex-video-readiness-20260907
    assessed_at: '2026-09-07T11:36:44.728509Z'
- id: hub_export_recovery_visibility
  category: operations
  title: Hub export remains observable across navigation and automatic retries
  acceptance:
  - Returning to a retained active export store restarts progress polling.
  - Transient failed jobs remain observable while automatic reconciliation can redispatch them.
  - Eligibility continues to require actual anonymization approval, finalized segment validation, processed
    media and matching export integrity.
  required: true
  verification:
    kind: manual
    instructions: Navigate away and back with unchanged active count; observe transient failure through
      automatic recovery. Verify backend rejection of unvalidated or nonprocessed export candidates.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: frontend/src/components/Export/HubExportOverviewComponent.vue
    - kind: test
      reference: frontend/src/components/Export/__tests__/HubExportOverviewComponent.test.ts (15 passed);
        tests/hub/test_hub_export_reconciliation.py (5 passed); tests/hub/test_hub_export_video_state_path.py
        (7 passed)
    note: Polling immediately evaluates retained state on remount and continues for failed transfers while
      automatic reconciliation may redispatch them; failed status remains distinct from active transfer
      counts. Queued/failed remount regressions and existing backend eligibility/reconciliation tests
      pass. Observation of deployed automatic recovery remains pending.
    assessed_by: codex-video-readiness-20260907
    assessed_at: '2026-09-07T11:36:48.511172Z'

schema_version: '1.0'
id: video_lifecycle_frontend_readiness
name: Video Lifecycle Frontend Readiness
description: Review import, recovery, anonymization approval, segment annotation and hub export as one
  operator workflow. September 7 review covers local frontend and mounted application/backend contracts;
  it does not establish browser acceptance on gc-05 or gc-10.
owners:
- lx-annotate frontend maintainers
- endoreg-db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: tests/README.md
  disposition: reference
  note: Test and contract verification boundaries.
definition_of_done:
- id: truthful_import_and_reimport
  category: requirements
  title: Import and reimport retain truthful state and visible recovery
  acceptance:
  - Duplicate detection never substitutes for anonymization approval or segment validation.
  - Validated videos show only the anonymized master derivative in the overview HTTP Live Streaming summary.
    Historical raw-video failures remain in the audit data and never override validation; queued or failed
    processed-video derivatives remain visibly pending or failed.
  - Reimport regenerates missing metadata or explicitly reports that only state repair was performed.
  - A partial import cannot become ANONYMIZED solely because metadata exists.
  - On a central hub, users from every center can discover, read, and prepare training data from validated
    processed videos after original raw-video deletion, through the mounted backend routes.
  - Retried imports remain visible through pending, processing and terminal failures and resume monitoring.
  - Failed import-only rows offer scoped removal from the overview by upload-job UUID. Dismissal preserves
    sources and audit history, requires confirmation and server authorization, and never calls media deletion.
  - Report corrections save a revision on the same report through apply-redactions with a source hash
    and normalized manifest, remove underlying source content, and require renewed anonymization review.
  - Report and video correction responses remain scoped to the selected media type and identifier; navigation
    cannot apply stale details or correction results to another item.
  required: true
  verification:
    kind: manual
    instructions: Exercise a duplicate unvalidated video, metadata-only failed import, missing metadata
      with retained raw media, and unattached retry through processing and failure.
    timeout_seconds: 600
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: frontend/src/stores/anonymizationStore.ts; frontend/src/components/Anonymizer/AnonymizationOverviewComponent.vue;
        lx_annotate/views/video_state_repair.py; lx_annotate/views/anonymization_overview.py
    - kind: test
      reference: tests/api/test_video_lifecycle_readiness.py; frontend/src/stores/__tests__/anonymizationStore.quarantine.spec.ts;
        frontend/src/components/Anonymizer/__tests__/AnonymizationOverviewComponent.test.ts
    - kind: test
      reference: '2026-09-07: PYTHONPATH=/home/admin/endoreg-db .devenv/state/venv/bin/python -m pytest
        -q tests/api/test_central_hub_training_access.py => 15 passed. Covers users from source, another
        center, and no membership; actual processed JPEG reads, default training manifests, PyTorch tensor
        reads, wrong-key/tamper rejection, private plaintext cleanup, and non-hub/raw/write/anonymous
        denials after deleting the original video.'
    - kind: test
      reference: '2026-09-07 full lx-annotate suite with updated backend source: 786 passed, 2 skipped,
        1 failed in 191.15s. The installed-wheel RECORD attestation rejected the intentional PYTHONPATH
        source override. No release acceptance or deployment claimed; new endoreg-db wheel required.'
    - kind: test
      reference: '2026-09-07 installed-wheel lane without PYTHONPATH override: .devenv/state/venv/bin/python
        -m pytest -q tests/system/test_production_celery_redis_recovery.py => 1 passed in 14.90s. This
        verifies the unchanged published 1.1.8 wheel, not the new training source changes.'
    - kind: code
      reference: '2026-09-08: lx_annotate/views/anonymization_overview.py verwendet overview_upload_job_retry_summary
        aus endoreg-db. Der lx-dtypes-Vertrag erlaubt zustandskonforme Einschränkungen der Aktionen. Generische
        ERROR/LOST-Importzeilen bieten keinen vom Retry-Endpunkt abgelehnten Neuimport mehr an; vorhandene
        Medien behalten ihren separaten Reimport-Vertrag.'
    - kind: command
      reference: '2026-09-08: endoreg-db mit PYTHONPATH=/home/admin/lx-data-models:/home/admin/endoreg-db:
        36 Import-/Overview-/Lease-Tests und 19 Reconciliation-Tests bestanden. lx-annotate tests/api/test_video_lifecycle_readiness.py:
        23 bestanden. lx-dtypes test_anonymization_overview.py: 17 bestanden (isoliert ohne Django-Plugin;

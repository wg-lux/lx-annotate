schema_version: '1.0'
id: pseudonym_import_reliability
name: Pseudonym Import Reliability
description: Reject unsafe patient resolution during import and make pseudonym regression failures visible.
owners:
- lx-annotate and endoreg-db maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: /home/admin/endoreg-db/AGENTS.md
  disposition: reference
  note: Backend owns patient identity resolution and report import behavior.
definition_of_done:
- id: identity_contract
  category: requirements
  title: Ambiguous identities fail closed
  acceptance:
  - Empty hashes, duplicate records, real-person matches and conflicting supplied centers cannot silently
    resolve an import patient.
  required: true
  verification:
    kind: manual
    instructions: Review backend patient lookup and regression tests.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'Backend tests/administration/person/test_pseudonym_resolution.py covers empty, duplicate,
        real-person and conflicting-center identities; combined backend SQLite suite: 91 passed, 15 skipped.'
    assessed_by: codex-pseudonym-reliability-20260910
    assessed_at: '2026-09-10T08:05:45.693475Z'
- id: report_resolution
  category: functionality
  title: Report names follow guarded patient resolution
  acceptance:
  - Report anonymization reuses only an unambiguous pseudonymous patient and preserves its established
    name.
  required: true
  verification:
    kind: manual
    instructions: Run backend report anonymization contract tests.
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'Backend tests/import_files/test_report_anonymization_contract.py covers existing name
        reuse and duplicate, real-person and center conflicts; combined backend SQLite suite: 91 passed,
        15 skipped.'
    assessed_by: codex-pseudonym-reliability-20260910
    assessed_at: '2026-09-10T08:05:49.606005Z'
- id: regression_checks
  category: testing
  title: Pseudonym tests fail on regressions
  acceptance:
  - Application tests assert hash persistence and repeatability and reject incomplete inputs without swallowing
    failures.
  required: true
  verification:
    kind: manual
    instructions: Run application privacy tests against the backend source.
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: '.devenv/state/venv/bin/pytest tests/privacy/test_pseudonym_generation.py -q --tb=short:
        3 passed against installed backend and 3 passed with PYTHONPATH=/home/admin/endoreg-db. Source
        module path confirmed as /home/admin/endoreg-db/endoreg_db/__init__.py.'
    assessed_by: codex-pseudonym-reliability-20260910
    assessed_at: '2026-09-10T08:05:52.484680Z'
- id: boundary_safety
  category: security
  title: Existing privacy and storage boundaries are preserved
  acceptance:
  - No hash algorithm, encryption, transport, storage or existing patient data is changed.
  required: true
  verification:
    kind: manual
    instructions: Review scoped diffs.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: 'Scoped diff review: only patient lookup, report name lookup, regression tests and YAML
        tracking changed. No identity algorithm, schema, storage, transport, deployment or existing patient-data
        mutations.'
    assessed_by: codex-pseudonym-reliability-20260910
    assessed_at: '2026-09-10T08:05:55.770694Z'
- id: runtime_rollout
  category: operations
  title: Backend changes reach the packaged application
  acceptance:
  - A released backend dependency includes these changes and installed-runtime import checks pass.
  - Concurrent creation and legacy duplicate reconciliation have explicit verified handling before production
    readiness.
  required: true
  verification:
    kind: manual
    instructions: Verify released backend version and deployment acceptance separately.
    timeout_seconds: 600
  assessment:
    status: blocked
    evidence:
    - kind: review
      reference: Application endoreg_db is an installed package; source checks used PYTHONPATH=/home/admin/endoreg-db
        explicitly.
    note: Backend source changes are not packaged into the application runtime. Concurrent patient creation
      prevention and PostgreSQL verification remain unresolved; no legacy reconciliation attempted.
    assessed_by: codex-pseudonym-reliability-20260910
    assessed_at: '2026-09-10T08:06:29.157898Z'
- id: evidence
  category: documentation
  title: YAML records scope and verification limits
  acceptance:
  - Results distinguish source verification from installed runtime and production acceptance.
  required: true
  verification:
    kind: manual
    instructions: Review this tracker and backend evidence.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: 'Results recorded here and in backend ImportPipelineRobustness.yml. Full Pyright: 0 errors,
        1 unrelated warning; focused Pyright: 0 errors, 0 warnings. Ruff passed. Backend SQLite tests:
        91 passed, 15 skipped, 1 plugin warning; initial PostgreSQL startup blocked by missing driver.
        Application tests: 3 passed against each backend. Both tracker validations passed.'
    assessed_by: codex-pseudonym-reliability-20260910
    assessed_at: '2026-09-10T08:06:31.380185Z'

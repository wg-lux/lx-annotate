definition_of_done:
- id: offline_export
  category: requirements
  title: Both Ninja APIs export without a running server
  acceptance:
  - The command exports separate endoreg-api and dtypes-api OpenAPI documents.
  - Output writes are atomic and deterministic.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/system/test_openapi_type_generation.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'tests/system/test_openapi_type_generation.py: 4 passed'
    - kind: test
      reference: All 5 tests/system/test_openapi_type_generation.py tests passed with Node from .devenv/profile/bin
        in the expanded 90-pass run.
    note: Restored manage.py command dispatch while preserving settings selection. All OpenAPI command
      and freshness tests pass against installed endoreg-db 1.3.8.
    assessed_by: codex-overview-20260924-a
    assessed_at: '2026-09-24T12:24:09.752204Z'
- id: generated_types
  category: functionality
  title: OpenAPI documents compile into TypeScript contracts
  acceptance:
  - Endoreg and dtypes schemas generate separate TypeScript modules.
  - Generated modules expose paths, operations, and components.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - typegen:check
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: npm --prefix frontend run typegen:check (exit 0)
    - kind: command
      reference: '2026-09-23: npm --prefix frontend run type-check:source: exit 0'
    - kind: command
      reference: Schema freshness passed; final npm --prefix frontend run type-check:source exit 0 (.devenv/state/endoreg-integration-frontend-verified.log).
        Targeted mypy passed for 3 production files; Ruff passed.
    - kind: test
      reference: tests/system/test_openapi_type_generation.py; full backend suite 1259 passed, 6 skipped;
        frontend casesApi 14 passed
    note: 'Installed lx-dtypes adds optional language query parameters; review contract compatibility
      and regenerate stale artifacts. Review 2026-10-07: regenerated root/frontend schemas and TypeScript
      from locally rebuilt endoreg-db 1.4.8 and installed lx-dtypes. Dtypes drift consists only of optional
      de/en language parameters, default de; endpoint tests verify rejection of unsupported values and

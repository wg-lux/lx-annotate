definition_of_done:
- id: offline_export
  category: requirements
  title: Both Ninja APIs export without a running server
  acceptance:
  - The command exports separate endoreg-api and dtypes-api OpenAPI documents.
  - Output writes are atomic and deterministic.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/system/test_openapi_type_generation.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'tests/system/test_openapi_type_generation.py: 4 passed'
    note: Offline command deterministically exports separately prefixed endoreg-api and dtypes-api schemas
      using atomic writes.
    assessed_by: codex-openapi-typegen-20260825
    assessed_at: '2026-08-25T12:40:25.071056Z'
- id: generated_types
  category: functionality
  title: OpenAPI documents compile into TypeScript contracts
  acceptance:
  - Endoreg and dtypes schemas generate separate TypeScript modules.
  - Generated modules expose paths, operations, and components.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - typegen:check
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: npm --prefix frontend run typegen:check (exit 0)
    note: Both OpenAPI documents compile to separate generated modules exposing paths, operations, and
      components; recursive JSON remains strongly typed.
    assessed_by: codex-openapi-typegen-20260825
    assessed_at: '2026-08-25T12:40:26.884625Z'
- id: generation_tests
  category: testing

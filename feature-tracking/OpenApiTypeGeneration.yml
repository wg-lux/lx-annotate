- id: safe_generation
  category: security
  title: Type generation does not weaken runtime configuration
  acceptance:
  - Production secrets are not embedded in scripts or generated artifacts.
  - Schema export writes through the typed atomic filesystem boundary.
  required: true
  verification:
    kind: manual
    instructions: Review management bootstrap, exporter, scripts, and generated artifacts.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: manage.py and export_openapi.py
    note: Test settings are honored before base settings import; no production secret is required or emitted;
      project atomic filesystem wrappers persist artifacts.
    assessed_by: codex-openapi-typegen-20260825
    assessed_at: '2026-08-25T12:40:30.597976Z'

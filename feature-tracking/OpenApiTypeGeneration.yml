definition_of_done:
- id: offline_export
  category: requirements
  title: Both Ninja APIs export without a running server
  acceptance:
  - DRF schema generation emits no path-parameter inference or operation identifier collision warnings;
    patient medication and schedule identifiers are integers.
  - The command exports separate endoreg-api and dtypes-api OpenAPI documents.
  - Output writes are atomic and deterministic.
  required: true
  verification:
    kind: command
    command:
    - devenv
    - shell
    - --
    - .devenv/state/venv/bin/pytest
    - tests/system/test_openapi_type_generation.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: 'tests/system/test_openapi_type_generation.py: 4 passed'
    - kind: test
      reference: All 5 tests/system/test_openapi_type_generation.py tests passed with Node from .devenv/profile/bin
        in the expanded 90-pass run.
    - kind: command
      reference: '2026-10-09: PYTHONPATH=.devenv/state/release-recovery-probe pytest tests/system/test_production_celery_redis_recovery.py
        tests/system/test_openapi_type_generation.py -q: 18 passed in 106.60s. Full LX-Annotate Pyright
        with isolated wheel dependencies: 0 errors, 0 warnings; focused changed-file Pyright: 0 errors,
        0 warnings; Ruff passed.'
    note: Explicit collection and compatibility operation identifiers remove all reported collisions,
      including pending study collection routes. Patient medication and schedule path parameters are documented
      as integers. Regression rejects schema warnings and duplicate identifiers. No endpoint runtime behavior
      changed.
    assessed_by: codex-release-fixes-20261009
    assessed_at: '2026-10-09T09:38:07.905944Z'

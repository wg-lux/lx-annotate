schema_version: '1.0'
id: migration_override_retirement
name: Migration Override Retirement
description: Safely converge databases from LX-Annotate migration overrides to the canonical dependency
  migration histories before removing MIGRATION_MODULES.
owners:
- lx-annotate maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/guides/deployment-strategy.md
  disposition: reference
  note: Defines the runtime schema gate and deployment migration ownership.
definition_of_done:
- id: convergence_contract
  category: requirements
  title: Legacy and canonical migration histories have an explicit convergence contract
  acceptance:
  - Supported package versions, legacy leaves, canonical leaves, and failure conditions are explicit.
  - Legacy migration records remain available for rollback.
  required: true
  verification:
    kind: manual
    instructions: Review the command constants, help text, and deployment guide.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: guarded_bridge
  category: functionality
  title: A fail-closed command records canonical migration identities
  acceptance:
  - The command performs a dry-run by default and requires an explicit apply flag to write.
  - Writes are atomic, idempotent, and limited to missing canonical migration records.
  required: true
  verification:
    kind: command
    command:
    - ./.devenv/state/venv/bin/pytest
    - tests/system/test_migration_history_convergence.py
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: ./.devenv/state/venv/bin/pytest tests/system/test_migration_history_convergence.py
      note: Exit-Code 0
    assessed_by: codex-migration-overrides-audit
    assessed_at: '2026-08-12T07:04:30.038071Z'
- id: history_tests
  category: testing
  title: Legacy, partial, unexpected, idempotent, and successful histories are tested
  acceptance:
  - Tests prove a supported legacy history converges to an empty canonical plan.
  - Tests prove unsupported or incomplete histories fail without writes.
  required: true
  verification:
    kind: command
    command:
    - ./.devenv/state/venv/bin/pytest
    - tests/system/test_migration_history_convergence.py
    - tests/system/test_submodule_migration_coverage.py
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: command
      reference: ./.devenv/state/venv/bin/pytest tests/system/test_migration_history_convergence.py tests/system/test_submodule_migration_coverage.py
      note: Exit-Code 0
    assessed_by: codex-migration-overrides-audit
    assessed_at: '2026-08-12T07:04:35.616466Z'
- id: fail_closed
  category: security
  title: Convergence fails closed before migration metadata mutation
  acceptance:
  - Package versions, migration manifests, runtime checks, and database history are verified before apply.
  - No payload, encryption-key, or application-data mutation is introduced.
  required: true
  verification:
    kind: manual
    instructions: Review the command transaction and all precondition tests.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: rollout
  category: operations
  title: Two-release rollout and rollback procedures are documented
  acceptance:
  - Release A retains overrides while converging every database.
  - Release B removes overrides only after fleet-wide verification, and rollback retains canonical records.
  required: true
  verification:
    kind: manual
    instructions: Review the migration override retirement section of the deployment guide.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []
- id: documentation
  category: documentation
  title: Operator documentation names exact commands and stop conditions
  acceptance:
  - Dry-run, apply, verification, and rollback commands are documented in English.
  required: true
  verification:
    kind: manual
    instructions: Review docs/guides/deployment-strategy.md for executable operator guidance.
    timeout_seconds: 300
  assessment:
    status: not_assessed
    evidence: []

definition_of_done:
- id: retry_scope
  category: requirements
  title: Failed-video retry scope is explicit
  acceptance:
  - Retry applies only to an existing failed video job that remains eligible for Hub Export.
  - Marked, active, completed, ineligible, and report jobs retain their existing behavior.
  required: true
  verification:
    kind: manual
    instructions: Review the implementation and focused tests against the Hub Export job state model.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: review
      reference: lx_annotate/hub/hub_export_jobs.py state transition and focused diff review
    note: Bulk retry is limited to eligible video jobs whose locked local status is failed; all other
      registered states retain the existing path.
    assessed_by: codex-video-retry-20260826
    assessed_at: '2026-08-26T07:06:19.333606Z'
- id: failed_video_bulk_retry
  category: functionality
  title: The bulk video action retries eligible failed transfers
  acceptance:
  - An eligible failed video keeps its stable outbound job and transfer identity when retried.
  - The bulk video action queues the failed job and dispatches it after the transaction commits.
  - Ineligible or non-failed registered jobs are not reset by the retry path.
  required: true
  verification:
    kind: command
    command:
    - uv
    - run
    - --frozen
    - --extra
    - dev
    - pytest
    - tests/hub/test_hub_export_api.py
    - -q
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'uv run --frozen --extra dev pytest tests/hub/test_hub_export*.py -q: 127 passed'
    note: An eligible failed video is requeued through the existing job, counted as queued, and dispatched
      once after commit.
    assessed_by: codex-video-retry-20260826
    assessed_at: '2026-08-26T07:06:21.868449Z'
- id: retry_transfer_identity
  category: data_integrity
  title: Retry preserves transfer identity
  acceptance:
  - Retry reuses the existing outbound job ID and transfer key.
  - Retry clears prior failure fields only when transitioning the locked failed job to queued.
  required: true
  verification:
    kind: manual
    instructions: Inspect the locked state transition and its backend assertions.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'test_bulk_video_offload_retries_existing_failed_job: original job ID and transfer key
        preserved; failure fields cleared; queued'
    note: The shared locked helper performs the same atomic failed-to-queued transition for bulk and row
      retries.
    assessed_by: codex-video-retry-20260826
    assessed_at: '2026-08-26T07:06:24.078265Z'
- id: retry_security_boundary
  category: security
  title: Retry preserves authentication and transport gates
  acceptance:
  - Retry continues to require an authenticated operator and an active source and target node.
  - The change does not alter mTLS, payload handling, key material, or raw-media export policy.
  required: true
  verification:
    kind: manual
    instructions: Review the retry call path and confirm existing authentication and eligibility checks
      remain authoritative.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'Hub Export security/integration suite included mTLS, envelope, payload guards, and API
        authentication: 127 passed'
    note: Authentication, active-node, eligibility, transfer-key, and transport boundaries remain unchanged
      and fail closed.
    assessed_by: codex-video-retry-20260826
    assessed_at: '2026-08-26T07:06:27.164049Z'

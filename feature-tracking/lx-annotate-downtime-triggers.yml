    - journalctl -u lx-annotate-hub-backup.service --since '7 days ago' --no-pager -n 30
    - journalctl --namespace=lx-annotate -u lx-annotate.service --since '2026-09-07 12:00:00 UTC' --until '2026-09-14 12:00:00 UTC' --no-pager -g 'No packaged static' -o cat | wc -l
    - journalctl -u lx-annotate-hub-backup.service --since '2026-09-07 12:00:00 UTC' --until '2026-09-14 12:00:00 UTC' --no-pager -g '243/CREDENTIALS' -o cat | wc -l
    - journalctl -u lx-annotate-hub-backup.service --since '7 days ago' --no-pager -g 'Finished' -o cat | wc -l
    - curl -sS --max-time 5 -o /dev/null -w 'http=%{http_code}\n' -H 'Host: gs-02.intern' http://127.0.0.1:8117/
    - nvidia-smi --query-gpu=name,memory.used,memory.total,utilization.gpu --format=csv,noheader
    - timeout 5 redis-cli LLEN pipeline
    - timeout 5 redis-cli LLEN llm_inference
    - journalctl -k --since '7 days ago' --no-pager -g 'oom-kill|Out of memory|Killed process|Xid' -n 5

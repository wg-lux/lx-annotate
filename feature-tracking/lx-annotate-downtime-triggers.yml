    - systemctl show lx-annotate-migrate.service -p InactiveExitTimestamp -p ExecMainStartTimestamp -p TimeoutStartUSec
    - cat /proc/pressure/memory /proc/pressure/io
    - findmnt -T /var/lib/lx-annotate/data
    - findmnt -T /mnt/endoreg-client-storage
    - curl -sS --max-time 8 -o /dev/null -w 'local_default_host_http=%{http_code} seconds=%{time_total}\n' http://127.0.0.1:8117/
    - journalctl --namespace=lx-annotate -u lx-annotate-hub-export-health.service --since '24 hours ago' --no-pager -n 3
    - journalctl --namespace=lx-annotate --since '2026-09-14 14:02:20' --until '2026-09-14 14:02:30' --no-pager -g 'onnxruntime|CUDA|CUDNN|allocat|memory|Exception|Error|Failed to' -n 25

    - hostname
    - date -u
    - sudo -n true
    - ssh -o BatchMode=yes -o ConnectTimeout=10 admin@172.16.255.110
    - ssh -o BatchMode=yes -o ConnectTimeout=10 admin@172.16.255.22
    - ssh -o BatchMode=yes -o ConnectTimeout=8 -o ProxyJump=admin@172.16.255.22 admin@172.16.255.110
  common_read_only:
    - systemctl list-units 'lx-annotate*' --all --no-pager --plain
    - systemctl show lx-annotate.service -p ActiveState -p SubState -p Result -p NRestarts -p ExecMainStatus
    - journalctl --namespace=lx-annotate -u lx-annotate.service --since '24 hours ago' --no-pager -n 60
    - systemctl is-active nginx postgresql redis-lx-annotate
    - timeout 5 redis-cli PING
    - timeout 5 pg_isready -h 127.0.0.1 -p 5432
    - df -h /var/lib/lx-annotate /var/lib/lx-annotate/data
    - free -h

- id: pressing_scope
  category: requirements
  title: Pressing issues have owners, severity, and bounded acceptance criteria
  acceptance:
  - Each production blocker names its owning repository and responsible maintainer group.
  - Cross-repository dependencies distinguish application, endoreg_db package, database schema, and LuxNix
    host responsibilities.
  - New issues are added here before implementation rather than tracked in parallel status documents.
  - 'P0 release and security blockers: release_0_9_55_artifact, production_secret_contract, filesystem_integrity,
    and least_privilege_delivery are owned in this repository by the lx-annotate maintainers and require
    security or release-owner approval where their verification instructions say so.'
  - 'P1 engineering blockers: automated_quality_gates, frontend_ownership_boundaries, dependency_and_tooling_contract,
    and repository_hygiene are owned in this repository by the lx-annotate maintainers.'
  - Cross-repository package or schema defects are owned by the endoreg_db maintainers until published
    in an immutable endoreg-db release; governed terminology registry and API defects are owned by the
    lx-dtypes maintainers until published in an immutable lx-dtypes release.
  - LuxNix maintainers and deployment operators own host mTLS, secret-file injection, encrypted runtime
    storage, systemd unit, reverse-proxy, and deployment-environment responsibilities; lx-annotate must
    validate those inputs and fail closed but must not silently assume host ownership.
  required: true
  verification:
    kind: manual
    instructions: Review the issue set with application, security, and operations owners.
    timeout_seconds: 300
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: feature-tracking/LxAnnotatePressingIssues.yml
    - kind: document
      reference: docs/guides/deployment-strategy.md
    note: Severity, repository ownership, maintainer responsibility, and cross-repository handoff boundaries
      are now explicit in the canonical tracker. Verification remains pending named application, security,
      release, and operations owner review; no owner approval is inferred from implementation work.
    assessed_by: codex-root-lxannotate
    assessed_at: '2026-08-03T10:52:43.141636Z'
- id: production_secret_contract
  category: security
  title: Production Django secrets are explicitly injected and fail closed
  acceptance:
  - Production startup rejects a missing Django secret instead of generating or persisting one.
  - A read-only or unavailable secret location cannot trigger an ephemeral production secret fallback.
  - Development-only secret generation is explicitly separated from production configuration.
  - Secret values never appear in application configuration, logs, or version control.
  required: true
  verification:
    kind: command
    command:
    - ./scripts/run-backend-checks.sh
    - tests/system/test_settings.py
    - tests/system/test_environment_checks.py
    - -q
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: lx_annotate/settings/secret_key.py
    - kind: code
      reference: lx_annotate/settings/settings_prod.py
    - kind: command
      reference: ./scripts/run-backend-checks.sh -q (339 passed, 2 skipped)
    - kind: review
      reference: lx_annotate/settings/config.py; lx_annotate/settings/secret_key.py; lx_annotate/settings/settings_test.py
    note: Production now rejects a missing or short configured secret, never invokes secret generation,
      and the explicit development helper uses the audited atomic wrapper with strict permissions and
      propagates write failures.
    assessed_by: Codex
    assessed_at: '2026-07-28T09:17:36.469567Z'

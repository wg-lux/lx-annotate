- id: german_reporting_experience
  category: functionality
  title: German reporting uses canonical clinical labels and a recognition-first workflow
  acceptance:
  - Canonical LXDM name_de values take precedence over stable technical names for indications and choices;
    the frontend contains no clinical translation map.
  - ID-only or malformed clinical options are not exposed as selectable labels, while unavailable persisted
    selections remain visibly recoverable without showing their numerical identifiers.
  - Report workflow statuses, dates, actions, and success messages use concise German presentation labels;
    report and examination identifiers remain available only in collapsed technical details.
  - Validator internals are hidden by default behind an accessible details control, while the visible
    summary gives a short actionable count of missing data and unmet rules.
  required: true
  verification:
    kind: command
    command:
    - bash
    - -lc
    - cd frontend && npm exec -- vitest run src/api/__tests__/reportingLanguagesApi.test.ts src/views/reporting/__tests__/reportingPresentation.test.ts
      src/views/reporting/__tests__/reportingIndicationContract.test.ts src/views/reporting/__tests__/FinalizedResultPage.test.ts

- id: least_privilege_delivery
  category: security
  title: CI and promotion use least privilege and explicit release intent
  acceptance:
  - Repository write permission is scoped only to the job that requires it.
  - Pull-request and ordinary branch validation run with read-only permissions.
  - Promotion to prototype is limited to an explicitly documented source branch or approved release action.
  required: true
  verification:
    kind: manual
    instructions: Review GitHub Actions permissions, triggers, environments, and branch-protection behavior.
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: .github/workflows/ci-cd.yml
    - kind: code
      reference: .github/workflows/wheel-testpypi.yml
    - kind: review
      reference: Workflow permission and trigger audit 2026-08-03
    note: Workflow permissions default to contents:read. Only the main-to-prototype delivery job receives
      contents:write, prototype promotion is limited to tested pushes on main, and PyPI publication requires
      a published matching release tag plus the protected pypi environment with OIDC.
    assessed_by: codex-root-lxannotate
    assessed_at: '2026-08-03T10:33:17.327917Z'
- id: dependency_and_tooling_contract
  category: operations
  title: Runtime dependencies, versions, and test configuration are unambiguous
  acceptance:
  - Runtime dependencies exclude build, formatting, type-checking, and test-only packages.
  - Duplicate or compatibility dependency names are removed or documented.
  - Python, root package, and frontend version identifiers follow one release policy.
  - Exactly one authoritative pytest configuration is loaded without warnings.
  required: true
  verification:
    kind: command
    command:
    - ./scripts/run-backend-checks.sh
    - -q
    timeout_seconds: 1800
  assessment:
    status: verified
    evidence:
    - kind: code
      reference: pyproject.toml
    - kind: code
      reference: pytest.ini
    - kind: code
      reference: tests/system/test_console_scripts_contract.py
    - kind: command
      reference: uv lock --check; uv run pytest tests/system/test_console_scripts_contract.py -q (11 passed)
    - kind: command
      reference: uv run mypy lx_annotate; uv run ruff check lx_annotate tests (passed)
    - kind: command
      reference: uv lock --check passed for 392 packages; Wheel METADATA contains endoreg-db==1.0.8.4
        and lx-dtypes==0.2.11
    note: Runtime and private frontend metadata share version 0.9.55. The lock resolves exactly endoreg-db
      1.0.8.4 and lx-dtypes 0.2.11; build, test, formatting, typing, and stub packages remain development-only.
    assessed_by: codex/root
    assessed_at: '2026-08-03T16:06:10.114085Z'
- id: repository_hygiene
  category: documentation
  title: Generated artifacts and static assets have one canonical ownership path
  acceptance:
  - Generated documentation and frontend build output are not tracked in redundant locations.
  - Large static assets have one canonical source and a reproducible packaging path.
  - Cleanup preserves wheel, Nix, and deployed static-file contracts.
  - Repository maintenance instructions explain regeneration and release packaging.
  required: true
  verification:
    kind: manual
    instructions: Compare tracked artifacts, package manifests, build outputs, and clean-checkout package
      results.
    timeout_seconds: 600
  assessment:
    status: verified
    evidence:

  - Large static assets have one canonical source and a reproducible packaging path.
  - Cleanup preserves wheel, Nix, and deployed static-file contracts.
  - Repository maintenance instructions explain regeneration and release packaging.
  required: true
  verification:
    kind: manual
    instructions: Compare tracked artifacts, package manifests, build outputs, and clean-checkout package
      results.
    timeout_seconds: 600
  assessment:

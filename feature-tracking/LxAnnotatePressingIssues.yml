      Reproduction and exact quartet/baseline wheel hashes in docs/guides/watcher-scans.md. Wheels include
      pre-existing dirty application/assets scope; unrelated staged frontend changes were not rebuilt/accepted.
      Ruff/Pyright/structure/diff pass. uv lock --check --offline fails because unpublished endoreg-db1.5.8.dev1
      is unavailable; user lockfile preserved. Keep in_progress: successful nonempty processing and bounded

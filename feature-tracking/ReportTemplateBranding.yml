schema_version: '1.0'
id: report_template_branding
name: Report Template Branding
description: Add hospital branding controls and a realistic editable page preview to the report-template
  builder.
owners:
- lx-annotate frontend maintainers
production_critical: true
tracking:
  state: active
  history: []
source_documents:

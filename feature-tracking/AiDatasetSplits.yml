- id: split_integrity
  category: requirements
  title: Reproducible persisted patient-grouped splits
  acceptance:
  - Test patients stay fixed across folds and each remaining patient validates exactly once.
  - No patient, video, or annotation is shared between roles within a fold.
  - Invalid requests and missing or conflicting patient associations fail without saving.
  - Saved plans retain snapshot membership and are accessible only within authorized centers.
  required: true
  verification:
    kind: manual
    instructions: Run focused backend and frontend split tests and inspect migration consistency.
    timeout_seconds: 300
  assessment:

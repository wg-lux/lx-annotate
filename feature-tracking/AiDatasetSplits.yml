schema_version: '1.0'
id: ai_dataset_splits
name: Patient-grouped AI dataset splits
description: Saved annotation membership snapshots with a fixed patient test holdout and rotating k-fold
  validation, Bootstrap bucket fill levels and label presence histograms. Fractions target patient counts,
  not frame counts. Missing or inconsistent patient links fail closed. Existing dataset display filters
  do not filter split membership. Plans use all attached image and segment annotations. The seed shuffles
  sorted patient IDs; rounded holdout patients remain fixed across k values for the same population, seed
  and test percentage. Remaining patients rotate through validation once. Labels are not stratified. Snapshots
  freeze membership IDs, not annotation content or media. Training consumers can read membership from
  the plan detail endpoint; this feature does not modify training execution or export media. Endpoints
  are GET/POST settings/application/ai_datasets/{dataset_id}/split_plans/ and GET settings/application/ai_datasets/{dataset_id}/split_plans/{plan_id}/
  under endoreg-api/. POST accepts name, k (2-20), test_percent (1-50), and seed (0-2147483647). A membership
  validation_fold of null is test; for fold i, validation_fold i is validation and other non-null folds
  are training. Apply migration lx_annotate.0008_aidatasetsplitplan before using the page. No migration
  has been applied to an application or production database by this task.
owners:
- lx-annotate maintainers
production_critical: false
tracking:
  state: active
  history: []
source_documents: []

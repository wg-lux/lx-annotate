- id: saved_patient_link_integrity
  category: data_integrity
  title: Saved split membership rejects changed patient associations
  acceptance:
  - Before returning saved membership, recheck every saved video against its recorded patient using the
    same direct/examination resolution as plan creation.
  - Return HTTP 409 without membership for reassigned, missing, conflicting or deleted video/patient links.
    Preserve the original snapshot and historical list summaries.
  - Check center authorization before returning drift errors. Accept equivalent examination-based linkage
    and dataset membership changes that leave the saved video-to-patient mapping intact.
  required: true
  verification:
    kind: command
    command:
    - .devenv/state/venv/bin/python
    - -m
    - pytest
    - tests/api/test_ai_dataset_splits.py
    - -q
    - --tb=short
    - --show-capture=no
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'tests/api/test_ai_dataset_splits.py: 19 passed in 6.27s; six new cases cover four drift
        modes, equivalent examination linkage and authorization precedence.'
    - kind: test

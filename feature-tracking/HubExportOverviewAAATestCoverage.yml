- id: frontend_route_component_aaa
  category: functionality
  title: Frontend route, view, and component callers have AAA coverage
  acceptance:
  - The /hub-export route resolves the HubExport view.
  - The view renders HubExportOverviewComponent.
  - The component suite covers loading, rendering, selection, mutation, retry, readiness, filtering, and
    errors.
  required: true
  verification:
    kind: command
    command:
    - npm
    - --prefix
    - frontend
    - run
    - test:unit
    - --
    - --run
    - src/views/__tests__/HubExport.test.ts
    - src/components/Export/__tests__/HubExportOverviewComponent.test.ts
    timeout_seconds: 300
  assessment:
    status: verified
    evidence:
    - kind: test
      reference: 'Vitest Hub Export route/view/component coverage: 15 passed'
    note: The lazy route resolves HubExport.vue, the view owns HubExportOverviewComponent, and the existing
      13-case component behavior suite passes.
    assessed_by: codex-hub-export-aaa
    assessed_at: '2026-08-27T09:17:42.860421Z'

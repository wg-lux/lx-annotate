      pass with 9 tests.
  - action: reopened
    changed_by: codex-root-api-coverage
    changed_at: '2026-09-15T09:13:51.836455Z'
    note: Extend the pre-commit API gate with an explicit OpenAPI artifact freshness hook.
  - action: done
    changed_by: codex-root-api-coverage
    changed_at: '2026-09-15T09:17:19.231551Z'
    note: Explicit OpenAPI artifact freshness and non-duplicating frontend source hooks pass through pre-commit.
  - action: reopened
    changed_by: codex-root-api-coverage
    changed_at: '2026-09-15T09:19:11.762085Z'
    note: Final consistency review found the repository-level schema copy was not covered by the frontend-only

- id: admin_password_rotation_runbook
  category: documentation
  title: The host admin password has a durable secret-managed rotation procedure
  acceptance:
  - The current password is never copied into source, tracker evidence, command lines, logs, shell history,
    chat summaries, or generated documentation and must be treated as disclosed after use in this recovery
    context.
  - Durable rotation updates the host entry in the untracked LuxNix ansible/secrets/admin-passwords.yml
    input, imports and re-encrypts both plaintext and hashed forms through the documented LuxNix Vault
    bootstrap or update-secret workflow, exports the host-scoped secret, and deploys the resulting managed
    secret.
  - Rotation validation uses the LuxNix validate-admin-passwords workflow, confirms restricted secret-file
    ownership and mode, proves a fresh authenticated session before closing the existing recovery session,
    and verifies sudo plus subsequent Nix activation retain access.
  - An interactive passwd change is documented as emergency-only because declarative hashedPasswordFile
    state can replace it; emergency changes are reconciled into Vault immediately through the durable
    workflow.
  - LuxNix removes the hard-coded default admin password hash and plaintext hint from its admin user module
    and fails closed with an actionable error when the managed hash file is absent.
  required: true
  verification:
    kind: manual
    instructions: 'Follow /home/admin/dev/luxnix/docs/vault-setup.md without placing the secret on a command
      line: update the ignored admin-password mapping, run vault-bootstrap with host-scoped export, run
      validate-admin-passwords, deploy the managed hash, open a fresh login, verify sudo, perform a subsequent
      Nix activation, and confirm the legacy fallback hash and password hint are absent from evaluated
      LuxNix sources and closures.'
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: document
      reference: /home/admin/dev/luxnix/docs/vault-setup.md

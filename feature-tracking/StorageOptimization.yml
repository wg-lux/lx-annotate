- id: authoritative_storage_inventory
  category: requirements
  title: Runtime bytes have typed identity, provenance, lifecycle, and reclaimability
  acceptance:
  - endoreg-db is the source of truth for each managed artifact's stable identity, content hash, size,
    storage mode, local and remote placement, source generation, retention state, active leases, and last
    verification.
  - Persisted inventory and workflow payloads are model-bound typed schemas rather than open dictionaries,
    and storage routing uses VideoStorageMode or another exhaustive typed enum instead of string dispatch.
  - Reconciliation distinguishes referenced, transferable, regenerable, cached, temporary, missing, corrupt,
    ambiguous, and LOST bytes without inferring database truth from filesystem presence or absence alone.
  - Inventory is bounded and resumable so scanning cannot exhaust the nearly full filesystem, database,
    memory, or worker queues, and it emits structured capacity and discrepancy metrics without patient
    identifiers.
  required: true
  verification:
    kind: manual
    instructions: Reconcile representative raw, processed, HLS, report, model, temporary, missing, corrupt,
      and concurrently leased artifacts against database rows and filesystem hashes; review typed schemas
      and exhaustive branches.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: /home/admin/endoreg-db/endoreg_db/services/video_storage/contracts.py::VideoStorageInventoryReport;
        endoreg_db/services/video_storage/inventory.py; endoreg_db/management/commands/normalize_video_storage.py
    - kind: code
      reference: /home/admin/endoreg-db/endoreg_db/services/video_storage/inventory.py converts persisted
        HLS artifact kinds to VideoArtifactKind, fails closed on unknown values, and caps each HLS artifact
        inventory scan at 20,000 filesystem entries with explicit incomplete/unreconciled classification;
        media bytes are never truncated or modified
    - kind: test
      reference: 'Focused bounded inventory command lane: 5 passed sequentially, 4 destructive/expensive
        tests skipped; the resume-safety failure path passed separately (1 passed); Ruff passed; Pyright
        0 errors'
    - kind: test
      reference: 'Unknown HLS artifact kind negative path: 1 passed sequentially; focused Ruff passed;
        focused Pyright 0 errors'
    - kind: test
      reference: 'Per-HLS-artifact entry ceiling: read-only inventory continues with incomplete/unreconciled
        evidence, reclaimable bytes are zero, media remains immutable, and apply is rejected before mutation;
        focused command lane 5 passed with 4 destructive/expensive skips'
    - kind: review
      reference: Existing hub placement/reconciliation models cover remote reservation, placement, receipt
        and reconciliation separately; unified lifecycle inventory remains outstanding
    note: >-
      endoreg-db already owns typed per-video byte accounting for raw, processed, streamable, and
      HLS artifacts, cleanup readiness, normalization evidence, references, and missing references. The
      normalization inventory is now bounded before filesystem traversal with a default batch of 100,
      hard maximum 1000, and stable primary-key resume cursor. HLS byte routing now converts persisted
      values into the existing typed enum and rejects unknown kinds instead of silently omitting them.
      Each HLS artifact traversal is also limited to 20,000 filesystem entries. Reaching the cap no longer
      aborts read-only inventory: it emits an explicit incomplete/unreconciled scan result, forces reclaimable
      bytes to zero, and blocks apply and cleanup before mutation. This ceiling affects metadata traversal
      only; video and HLS media are never truncated, rewritten, moved, or partially stored. Full authoritative
      status remains open because local inventory is not yet unified with remote placement, transferability,
      corrupt/ambiguous/LOST classification, hashes, retention state, and last-verification timestamps in one
      model-bound view.
    assessed_by: codex-storage-optimization-20260824
    assessed_at: '2026-08-25T09:10:28Z'
- id: safe_anonymized_transfer
  category: security
  title: Eligible processed media can be transferred without weakening security or integrity
  acceptance:
  - Outbound transfer is limited to explicitly validated anonymized processed media; raw media, unvalidated
    anonymization output, secrets, the long-lived master key, and unrelated runtime state are never exported.
  - Host-to-host transport requires mTLS when the deployment profile requires it, and standalone transferred
    artifacts use per-transfer data-encryption keys wrapped to the receiving storage node's public key.
  - NetworkNode.shared_secret authenticates requests only and is never used for payload encryption.
  - Transfer persists a typed idempotency key, source and target identities, exact byte size and digest,
    recipient key version, retry state, and verified receipt before a placement can become readable or
    cleanup-eligible.
  - Source reclamation is a separate, deferred operation and cannot run until target verification, atomic
    placement publication, required replica policy, retention policy, and all active media-operation leases
    permit it.
  required: true
  verification:
    kind: manual
    instructions: Exercise success, replay, interruption, digest mismatch, wrong recipient, missing mTLS,
      target-full, stale receipt, and source-cleanup races against a production-like encrypted storage
      node.
    timeout_seconds: 2400
  assessment:
    status: blocked
    evidence:
    - kind: command
      reference: findmnt --mountpoint /mnt/endoreg-client-storage failed and findmnt -T resolved to /dev/mapper/cryptroot
    - kind: monitoring
      reference: 'lx-annotate-hub-export-health.service: total_jobs=1, configuration_rejection=1, critical_count=1;
        ffmpeg/hub workers and core web/database/cache services remain active'
    - kind: code
      reference: lx_annotate/models.py; lx_annotate/hub/hub_export_worker.py;
        lx_annotate/hub/hub_export_reconciliation.py; lx_annotate/hub/hub_export_cleanup.py;
        lx_annotate/management/commands/reap_verified_hub_exports.py
    - kind: test
      reference: '2026-08-25 focused receipt, reconciliation, cleanup, and import-smoke lane: 47 passed;
        focused Ruff, Pyright (0 errors), compileall, migration-drift, tracker validation, and diff checks passed'
    note: 'Live transfer cannot be represented as safe or usable: /mnt/endoreg-client-storage resolves
      to the root cryptroot rather than a separate mounted destination, the configured persisting-storage
      mount unit lacks STORAGE_PERSISTING_HDD_ID, and hub-export health reports one terminal configuration_rejection.
      The sender now persists a model-validated envelope receipt, requires it on direct and reconciled applied
      paths, and exposes bounded dry-run-first processed-video reaping that blocks on digest, size, identity,
      lease, and active-processing mismatches. Raw media and reports are not reaped. Central AI reads the
      receiver-managed processed file, or the committed remote placement provider when Hub storage balancing
      is enabled. No live media deletion or deployment occurred, and the live destination blocker remains.'
    assessed_by: codex-hub-transfer-20260825
    assessed_at: '2026-08-25T09:45:00Z'
- id: lazy_transcoding
  category: functionality
  title: Playback-ready HLS is generated eagerly and regenerated safely
  acceptance:
  - Successful import, reimport, reanonymization, and completed-duplicate return paths require atomically
    published raw and processed HLS before returning so time-critical playback does not wait for first-use
    transcoding.
  - An authenticated playback request for a legacy, evicted, or reconciled missing rendition creates one
    idempotent typed fallback request instead of transcoding synchronously in the web process.
  - Concurrent requests for the same source generation and rendition converge on one bounded worker job,
    expose pending and failed state honestly, and never publish partial output.
  - Transcoding writes through typed atomic filesystem helpers, verifies output and source-generation
    identity, publishes by atomic replacement, emits structured JSON logs, and cleans only its own proven
    temporary files.
  - A configurable cache and retention policy can reclaim regenerable renditions only when no lease is
    active; the validated source, annotation timeline, hashes, provenance, and encryption boundary remain
    intact.
  - Playback remains compatible with HTTP range delivery and provides an explicit retryable response while
    fallback regeneration is being prepared rather than silently falling back to raw-media export.
  required: true
  verification:
    kind: manual
    instructions: Sequentially test import-time raw and processed readiness, completed-duplicate repair,
      first playback, cache hit, fallback duplicate demand, worker restart, source replacement, low-space
      admission, failed transcode, partial-output cleanup, active-lease retention, expiry, and range playback.
    timeout_seconds: 2400
  assessment:
    status: in_progress
    evidence:
    - kind: code
      reference: /home/admin/endoreg-db/endoreg_db/import_files/file_storage/state_management.py; /home/admin/endoreg-db/endoreg_db/import_files/video_import_service.py;
        /home/admin/endoreg-db/endoreg_db/views/video/hls_stream.py
    - kind: test
      reference: TEST_DB_ENGINE=django.db.backends.sqlite3 TEST_DB_REUSE=false RUN_VIDEO_TESTS=true SKIP_EXPENSIVE_TESTS=true
        pytest -q -n0 focused files => 39 passed, 10 expensive tests skipped in 41.02s
    - kind: command
      reference: Focused Ruff passed; focused Pyright 0 errors; git diff --check passed
    note: 'Per the time-critical runtime requirement, eager HLS readiness is restored: import, reimport,
      reanonymization, and completed-duplicate paths require raw and processed HLS through the existing
      typed idempotent materializer before returning. The playlist endpoint retains bounded asynchronous
      regeneration only for legacy, evicted, or reconciled missing derivatives. Non-expensive database-backed
      tests, Ruff, Pyright, and diff checks pass; production capacity/load acceptance and expensive media
      tests remain outstanding.'
    assessed_by: codex-storage-optimization-20260824
    assessed_at: '2026-08-25T08:11:20.077258Z'
- id: bounded_capacity_admission
  category: operations
  title: Capacity pressure is controlled before work can fill the root filesystem
  acceptance:
  - LuxNix declares warning, admission-stop, emergency-reserve, transfer, eager-HLS, fallback-regeneration,
    retention, concurrency, bandwidth, and I/O-priority policy with safe per-host defaults and evaluated
    configuration assertions.
  - Ingest, extraction, prediction, transcoding, transfer, and cleanup reserve policy-usable bytes before
    work and release or reconcile reservations after success, failure, cancellation, timeout, and worker
    restart.
  - Low capacity blocks new write-amplifying work with an actionable typed reason while read-only viewing
    and essential services continue where integrity permits; no component silently redirects to an unapproved
    path.
  - Alerts distinguish filesystem free bytes, policy-usable bytes, reserved bytes, reclaimable bytes,
    transfer backlog, transcode backlog, stale telemetry, and cleanup failures without exposing patient
    data or secrets.
  - Expensive work remains queue-routed with bounded concurrency and I/O scheduling so recovery cannot
    create simultaneous transfers, transcodes, test runs, or rebuilds that overwhelm the filesystem.
  required: true
  verification:
    kind: manual
    instructions: Evaluate the target-host LuxNix configuration and inject warning, stop, reserve exhaustion,
      stale telemetry, queue restart, reservation leak, and recovery conditions while monitoring all production
      services.
    timeout_seconds: 1800
  assessment:
    status: in_progress
    evidence:
    - kind: test
      reference: /home/admin/dev/luxnix/tests/test_lx_annotate_storage_recovery_contract.py => 3 passed
        in 0.04s
    - kind: command
      reference: nix eval gc-02 system drv succeeded without a rebuild; evaluated warning=42949672960,
        stop=26843545600, cleanup requires endoreg-mount-persisting-storage.service
    note: LuxNix now declares typed positive warning/stop byte thresholds with an assertion that stop
      is lower than warning. gc-02 evaluates to 40 GiB warning and 25 GiB stop; the live 20 GiB free state
      is below the proposed stop, so new write-amplifying work will fail closed after deployment. Cleanup
      also requires a separate filesystem by default.
    assessed_by: codex-storage-optimization-20260824
    assessed_at: '2026-08-25T07:36:40.708919Z'
- id: cross_repository_contract_quality
  category: maintainability
  title: LX-Annotate, endoreg-db, and LuxNix changes remain minimal, compatible, and type safe
  acceptance:
  - endoreg-db owns typed artifact lifecycle, reservations, placement, reconciliation, and filesystem
    mutations; LX-Annotate owns authenticated API and operator workflows; LuxNix owns host storage, services,
    schedules, limits, secrets, and deployment policy.
  - Public contracts are versioned and compatibility-tested across the exact package revisions deployed
    together; migrations are additive, reversible where practical, and safe for existing rows and workers
    during rollout.
  - Python changes pass the repositories' configured Ruff, MyPy or Pyright, schema, migration-drift, and
    focused unit/integration gates; Nix changes pass formatting, evaluation, and focused contract tests.
  - The implementation uses existing public helpers and libraries, introduces no raw shutil mutation,
    non-atomic persistence, silent fallback, fake configuration, unvalidated persisted JSON, or stringly
    typed storage route.
  - The final review records exact repository revisions, locked Flake inputs, package versions, target
    host, dirty state, and artifact digests without claiming unrelated pre-existing worktree changes as
    feature evidence.
  required: true
  verification:
    kind: manual
    instructions: Review the cross-repository diff and compatibility matrix, then run each repository's
      narrow static, schema, migration, unit, and contract gates sequentially against the exact pinned
      dependency revisions.
    timeout_seconds: 3600
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: 'All three repositories: git diff --check passed; lx-annotate and endoreg feature-tracker
        validation passed'
    - kind: test
      reference: 'LuxNix focused storage and wheel tests: 6 passed sequentially across two isolated invocations;
        endoreg focused Ruff/Pyright/compileall passed'
    - kind: command
      reference: 'All three repositories: git diff --check and feature-tracker validation passed'
    - kind: test
      reference: endoreg eager-HLS lane 39 passed; bounded inventory lane 3 passed; wheel cleanup lane
        5 passed; focused Pyright 0 errors and Ruff passed
    - kind: test
      reference: LuxNix focused storage/wheel/provenance tests 8 passed; evaluated wheel digest matches
        active 1.0.4; host derivation evaluated without build
    note: 'Ownership remains correctly split: endoreg-db owns typed HLS lifecycle, bounded inventory,
      cleanup and dispatch; LX-Annotate owns authenticated playback/operator contracts; LuxNix owns host

- id: production_rollout_and_recovery
  category: operations
  title: Rollout, rollback, and recovery are measured and production safe
  acceptance:
  - Deployment follows immutable wheel or Nix-closure provenance and records repository paths, Git revisions,
    locked inputs, target host, LX-Annotate and endoreg-db versions, active generation, and artifact digests.
  - A canary phase proves transfer, eager import-time HLS, and fallback regeneration under representative
    load before retention cleanup is enabled, with explicit pause and kill switches that do not discard
    durable work state.
  - Rollback preserves schema compatibility, local and remote placement evidence, verified transferred
    copies, source generations, leases, and structured audit logs; it never guesses or deletes the canonical
    artifact.
  - Post-deployment acceptance verifies authenticated application access, protected playback, ingest admission,
    every worker queue, database, Redis, Nginx, capacity alerts, transfer, eager HLS, fallback regeneration,
    and restart recovery.
  - The feature is not marked complete until sustained capacity remains above policy thresholds and a
    reviewed recovery exercise demonstrates that interrupted work converges safely without full system
    reconstruction.
  required: true
  verification:
    kind: manual
    instructions: Perform a reviewed canary, controlled interruption, restart recovery, and rollback exercise
      on the named target while recording provenance, service health, capacity, audit, and reconciliation
      evidence.
    timeout_seconds: 3600
  assessment:

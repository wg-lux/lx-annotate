schema_version: '1.0'
id: storage_optimization
name: LX-Annotate Runtime Storage Optimization
description: Recover and sustainably protect capacity below /var/lib/lx-annotate through conservative
  cleanup, policy-controlled transfer of eligible anonymized artifacts, eager playback-ready HLS, and
  bounded fallback regeneration while preserving clinical data, cryptographic boundaries, service availability,
  and cross-repository type compatibility.
owners:
- lx-annotate maintainers
- endoreg-db maintainers
- LuxNix maintainers
- storage operations
- security operations
production_critical: true
tracking:
  state: active
  history: []
source_documents:
- path: docs/guides/deployment-strategy.md
  disposition: reference
  note: Canonical protected runtime root, deployment source, and encryption boundaries.
- path: docs/guides/wheel-deployment.md
  disposition: reference
  note: Wheel staging, runtime layout, host-owned storage paths, and secret-file contract.
- path: docs/guides/hub-storage-load-balancing.md
  disposition: reference
  note: Existing typed placement, envelope transfer, lease, reconciliation, and cleanup contracts.
- path: /home/admin/dev/luxnix/docs/deployment-guide.md
  disposition: reference
  note: LuxNix deployment and host verification workflow.
- path: /home/admin/dev/luxnix/docs/vault-setup.md
  disposition: reference
  note: Canonical admin-password import, rotation, export, and validation workflow.
definition_of_done:
- id: emergency_capacity_recovery
  category: operations
  title: A conservative cleanup restores working headroom before build or test work
  acceptance:
  - Record filesystem capacity, the largest bounded subtrees, active service generations, queued and running
    media jobs, open-file or lease evidence, and rollback artifacts before deleting or moving anything.
  - The first mutation removes only proven-reclaimable deployment staging, caches, or abandoned temporary
    artifacts; it does not remove clinical media, the active release, the selected rollback release, unique
    logs, database state, secrets, Nix store paths, or active Nix garbage-collection roots.
  - Cleanup uses the owning typed and atomic filesystem interface, records structured JSON evidence for
    every mutation, is idempotent, and fails closed when ownership, liveness, provenance, or retention
    is ambiguous.
  - A configurable warning, work-stop, and emergency reserve policy leaves enough measured headroom for
    the narrow sequential verification lane before later implementation work begins.
  - LX-Annotate, PostgreSQL, Redis, Nginx, the watcher, and every configured Celery queue remain healthy
    throughout cleanup; no service is stopped merely to make cleanup easier.
  required: true
  verification:
    kind: manual
    instructions: Capture before/after df and bounded inventory evidence, review every reclaimed path
      against the active generation and rollback set, inspect structured mutation logs, and run service
      and queue health checks.
    timeout_seconds: 900
  assessment:
    status: in_progress
    evidence:
    - kind: command
      reference: '2026-08-24 baseline: cryptroot was 477 GiB total, 465 GiB used, 8.7 GiB available (99%);
        the /var/lib/lx-annotate tree was approximately 180 GiB, including approximately 178 GiB under
        data and 2,420,525,134 bytes across 83 top-level wheel staging artifacts.'
    - kind: command
      reference: '2026-08-24 service inspection: lx-annotate 1.0.4 ran from the immutable Nix closure
        /nix/store/9l9lmzl7p2bjvrpsb9gx0hzg3qgzgihv-lx-annotate-wheel-runtime-1.0.4 while web, PostgreSQL,
        Redis, Nginx, watcher-related execution, and all configured Celery worker services remained running.'
    - kind: command
      reference: '2026-08-25: df -h / => 477G total, 453G used, 20G available, 96%; 83 wheel files =>
        2,420,525,134 bytes'
    - kind: test
      reference: '/home/admin/dev/luxnix: pytest -q -p no:django tests/test_lx_annotate_wheel_runtime_install.py
        => 3 passed in 0.15s'
    - kind: code
      reference: /home/admin/endoreg-db/endoreg_db/services/runtime_wheel_staging.py; /home/admin/dev/luxnix/modules/nixos/services/lx-annotate-local/scripts.nix
    - kind: test
      reference: 'endoreg cleanup: 5 passed sequentially, Ruff passed, Pyright 0 errors; LuxNix storage/wheel
        contracts: 7 passed sequentially'
    - kind: command

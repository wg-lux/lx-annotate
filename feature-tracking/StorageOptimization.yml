- id: sequential_verification_and_service_continuity
  category: testing
  title: Relevant tests pass sequentially without full-system rebuilds or service interruption
  acceptance:
  - A written verification matrix maps each changed contract to the narrowest relevant test, type, lint,
    migration, Nix evaluation, service-health, and production-like acceptance gate in LX-Annotate, endoreg-db,
    and LuxNix.
  - Test commands run one at a time with bounded temporary space and resource limits; parallel test execution,
    repository-wide build matrices, and full-system rebuilds are prohibited for this feature.
  - Broader integration checks run sequentially only when a changed module boundary requires them and
    only after capacity is re-measured against the emergency reserve.
  - All relevant gates pass without stopping production services, consuming protected media as fixtures,
    leaving unbounded caches or temporary artifacts, or using a checkout or test tree below /tmp as a
    production source.
  - Failure-injection covers full target, interrupted transfer, interrupted transcode, restart, stale
    lease, hash mismatch, ambiguous placement, and low-space admission; failures preserve evidence and
    fail closed.
  required: true
  verification:
    kind: manual
    instructions: Review timestamps and resource evidence proving serialized execution, inspect before/after
      capacity and service health, and verify every command and result in the cross-repository matrix.
    timeout_seconds: 3600
  assessment:
